<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B0F14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RitMeter">
<title>RitMeter — GPS snelheid &amp; trip</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════
   RitMeter — UI-laag (herbouw)
   Discipline:
   - zichtbaarheid UITSLUITEND via body[data-*]-selectors
   - geometrie (positie/grootte) UITSLUITEND in de twee
     oriëntatie-layouts (@media), niet in de modus
   - geen !important, geen specificiteit-gevechten
   ═══════════════════════════════════════════════════════════ */

:root{
  --bg:#0B0F14;
  --panel:rgba(13,19,26,.82);
  --line:#22303E;
  --text:#E9EEF3;
  --muted:#7E8B98;
  --amber:#FFB300;
  --digit:#FFB300;          /* instelbare cijferkleur (token, in render gezet) */
  --nav:#E000FF;
  --nav-dark:#3A0A33;
  --ok:#3AD673;
  --warn:#FFB300;
  --bad:#FF5252;
  --radius:18px;
  --dim-opacity:0;          /* nachtdimmer (token, in render gezet) */
  --speed-size:72px;        /* per oriëntatie + presentatie gezet */
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);
  --sar:env(safe-area-inset-right,0px);
   --ui: 1;
  --fab: calc(42px * var(--ui));
  --compass: calc(60px * var(--ui));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:manipulation;
  user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}

/* ── kaart: basislaag ─────────────────────────────────────── */
#map{position:fixed;inset:0;background:#0B0F14}
.maplibregl-ctrl-attrib{font-size:10px;background:rgba(11,15,20,.6)!important;color:#9aa7b4}
.maplibregl-ctrl-attrib a{color:#9aa7b4!important}

/* ── positiemarker ── */
.me{width:46px;height:46px;position:relative}
.me::before{content:"";position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle,rgba(255,179,0,.35),transparent 70%)}
.me svg{position:absolute;inset:8px;filter:drop-shadow(0 1px 4px rgba(0,0,0,.6))}
.navDest svg{filter:drop-shadow(0 2px 4px rgba(0,0,0,.6))}

/* ═══ UI-overlay: één grid over de kaart ═══════════════════
   pointer-events:none zodat de kaart sleepbaar blijft;
   interactieve regio's zetten pointer-events weer aan.        */
#ui{position:fixed;inset:0;z-index:10;display:grid;pointer-events:none;
  padding:calc(var(--sat) + 10px) calc(var(--sar) + 14px)
          calc(var(--sab) + 10px) calc(var(--sal) + 14px);
  gap:10px}
#ui > *{pointer-events:none;min-width:0}
/* alleen echte bedienelementen vangen aanrakingen op; lege regio's (kompas,
   snelheid, status, de hele linker-/onderstrook) laten ze door naar de kaart */
/* Patch 21: #unitBtn is hier weggehaald — de eenheid wordt uitsluitend
   in de instellingen omgezet. Zonder pointer-events valt een tik op het
   eenheidslabel door naar #r-speed (portret: in/uitklappen) of naar de
   kaart (tap-chrome), precies zoals de rest van het eiland. */
.fab,#r-recenter,#r-trip,#r-navinfo,#navPanel{pointer-events:auto}
/* eiland-wrapper (Patch 17): buiten Layout C structureel onzichtbaar,
   zodat #r-speed/#r-trip in portret/liggend/groot-getal directe
   grid-items van #ui blijven (grid-area's werken door) */
#r-island{display:contents}
   
/* ── appearance per regio (look, NIET geometrie/zichtbaarheid) ── */
.panel{background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--line)}

/* knoppenrail */
#r-controls{display:flex;flex-direction:column;gap:10px}
.fab svg{width:48%;height:48%}
.fab{width:var(--fab);height:var(--fab);border-radius:50%;background:var(--panel);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--line);display:grid;place-items:center;color:var(--muted)}
.fab:active{color:var(--amber)}
#navBtn:active{color:var(--nav)}

/* snelheidscluster */
#r-speed{align-self:start;justify-self:center;text-align:center;
  background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:var(--radius);
  padding:8px 26px 12px;min-width:196px;box-shadow:0 6px 24px rgba(0,0,0,.45)}
#speedVal{font-family:"Chakra Petch",system-ui,sans-serif;font-weight:700;
  font-size:var(--speed-size);line-height:1;letter-spacing:.5px;color:var(--text);
  font-variant-numeric:tabular-nums}
#speedVal.moving{color:var(--digit)}
#unitBtn{display:block;margin:2px auto 0;font-size:14px;font-weight:600;letter-spacing:.22em;
  color:var(--muted);text-transform:uppercase;padding:4px 14px;border-radius:99px}
#unitBtn:active{color:var(--amber)}

/* gps-status */
#r-status{justify-self:end;align-self:start;display:flex;align-items:center;gap:7px;
  background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:99px;padding:7px 13px;font-size:12px;color:var(--muted)}
#gpsDot{width:9px;height:9px;border-radius:50%;background:var(--bad);transition:background .3s}
#gpsDot.ok{background:var(--ok)}#gpsDot.mid{background:var(--warn)}

/* kompasroos */
#r-compass{justify-self:end;align-self:start;width:var(--compass);height:var(--compass);
  border-radius:50%;background:var(--panel);backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);border:1px solid var(--line)}
#r-compass svg{width:100%;height:100%;display:block}
#r-compass text{font:700 7.5px system-ui;fill:var(--muted)}
#r-compass .n{font:700 9.5px system-ui;fill:#fff}
#roseG{transform-origin:30px 30px;transition:transform .6s linear}

/* hoogte & koers */
#r-altitude{justify-self:center;align-self:start;display:flex;gap:18px;
  background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:99px;padding:8px 18px;
  font-family:"Chakra Petch",sans-serif;font-size:16px;font-variant-numeric:tabular-nums;
  color:var(--text);white-space:nowrap}
#r-altitude .lbl{color:var(--muted);font-family:system-ui,sans-serif;font-size:11px;
  letter-spacing:.12em;text-transform:uppercase;margin-right:6px;vertical-align:1px}

/* centreerknop */
#r-recenter{justify-self:end;align-self:end}
#r-zoom{justify-self:end;align-self:start;display:flex;flex-direction:column;gap:10px;position:relative}
#zoomIn:active,#zoomOut:active{color:var(--amber)}
/* zoomlevel-indicator (Patch 9): wit rondje links van de zoomknoppen,
   vervaagt vanzelf na een zoomwijziging */
#zoomLvl{position:absolute;right:calc(100% + 12px);top:50%;transform:translateY(-50%);
  width:var(--fab);height:var(--fab);border-radius:50%;background:#fff;color:#000;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  line-height:1;font-family:system-ui,sans-serif;font-weight:700;font-size:17px;
  box-shadow:0 2px 8px rgba(0,0,0,.35);
  opacity:0;pointer-events:none;transition:opacity .5s ease}
#zoomLvl.show{opacity:1;transition:none}
#zoomLvl .sub{font-size:9px;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;color:#555;margin-top:2px}
#r-recenter:active{color:var(--amber)}

/* nav-info: rustige regel met resterende afstand + ETA */
#r-navinfo{align-self:end;display:flex;align-items:center;gap:calc(10px * var(--ui));
  background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--nav);border-radius:99px;
  padding:calc(8px * var(--ui)) calc(14px * var(--ui));
  font-size:calc(14px * var(--ui));color:var(--text);font-variant-numeric:tabular-nums;
  box-shadow:0 4px 16px rgba(0,0,0,.4)}
#r-navinfo .nf{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#r-navinfo b{font-family:"Chakra Petch",sans-serif;font-size:calc(17px * var(--ui));color:var(--text)}
#navRecalc{flex:none;width:calc(34px * var(--ui));height:calc(34px * var(--ui));border-radius:50%;
  display:grid;place-items:center;background:#141C25;border:1px solid var(--line);color:var(--muted)}
#navRecalc:active{color:var(--nav)}
#navStopBtn{flex:none;width:calc(34px * var(--ui));height:calc(34px * var(--ui));border-radius:50%;
  display:grid;place-items:center;background:#2A1313;border:1px solid #5c2727;color:#FF8A8A;
  font-size:calc(20px * var(--ui));line-height:1}

/* tripbalk */
#r-trip{align-self:end;background:var(--panel);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:var(--radius);
  padding:12px 14px;box-shadow:0 6px 24px rgba(0,0,0,.45)}
#stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px;text-align:center}
.stat b{display:block;font-family:"Chakra Petch",sans-serif;font-weight:600;font-size:21px;
  font-variant-numeric:tabular-nums;color:var(--text)}
.stat span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
#btnRow{display:flex;gap:10px}
.btn{flex:1;padding:13px 0;border-radius:13px;font-weight:700;font-size:16px;letter-spacing:.04em;
  border:1px solid var(--line);background:#141C25;transition:transform .06s}
.btn:active{transform:scale(.97)}
#startBtn.go{background:var(--amber);border-color:var(--amber);color:#1A1200}
#startBtn.halt{background:#2A1313;border-color:#5c2727;color:#FF8A8A}
#resetBtn{flex:0 0 auto;padding-left:16px;padding-right:16px;color:var(--muted)}
#resetBtn:disabled{opacity:.35}
   /* na 'Stop': rit staat op pauze en is nog niet opgeslagen →
   Opslaan+reset wordt de primaire actie (amber gevuld),
   Hervat wordt secundair (amber contour) zodat de keuze duidelijk is */
body[data-measuring="paused"] #resetBtn:not(:disabled){
  opacity:1;color:#1A1200;background:var(--amber);border-color:var(--amber);
  animation:savePulse 1.6s ease-in-out infinite}
body[data-measuring="paused"] #startBtn.go{background:transparent;color:var(--amber)}
@keyframes savePulse{
  0%,100%{box-shadow:0 0 0 0 rgba(255,179,0,.45)}
  50%{box-shadow:0 0 0 6px rgba(255,179,0,0)}}
/* tripbalk contextgevoelig (Patch 14): bij idle geen nul-statistieken
   en geen (toch al disabled) resetknop — alleen een smalle startstrook.
   'paused' blijft bewust volledig: daar neem je de opslaan-beslissing
   op basis van de cijfers. display:none wint hier van elke andere
   #stats-regel, dus ook de route-compacte hieronder. */
body[data-measuring="idle"] #stats{display:none}
body[data-measuring="idle"] #resetBtn{display:none}

/* compactere tripbalk tijdens route (alleen appearance) */
body[data-nav="route"] #stats{margin-bottom:8px;gap:5px}
body[data-nav="route"] .stat b{font-size:17px}
body[data-nav="route"] .btn{padding-top:10px;padding-bottom:10px;font-size:14px}

/* schermvullend tikvlak om uit groot-getal te gaan */
#r-exit{position:fixed;inset:0;z-index:11;background:transparent}
#r-exit #exitHint{position:absolute;left:0;right:0;bottom:calc(var(--sab) + 18px);
  text-align:center;color:var(--muted);font-size:13px;letter-spacing:.08em}

/* Patch 20: de dim-laag is nu thema-gestuurd i.p.v. een schuifregelaar.
   De UI-chrome is al donker; het thema regelt de KAART (licht/donker)
   plus dit restdempertje. Tunable: .10 — zet op 0 als je hem niet wil. */
#dim{position:fixed;inset:0;z-index:65;background:#000;opacity:var(--dim-opacity);pointer-events:none}
body[data-theme="day"]{--dim-opacity:0}
/* Patch 22: van .10 naar .04. De kaart is nu zelf donker; die extra
   zwarte laag haalde juist het contrast uit de bebouwingscontouren.
   Zet op 0 als je hem helemaal niet wilt. */
body[data-theme="night"]{--dim-opacity:.04}

/* ═══ ZICHTBAARHEID — uitsluitend body[data-*] ═════════════
   Elk eindresultaat wordt door precies één winnende regel
   bepaald; geen volgorde-afhankelijke override-stapels.      */

/* groot-getal verbergt de hele kaart-chrome */
body[data-presentation="big"] #map,
body[data-presentation="big"] #r-controls,
body[data-presentation="big"] #r-status,
body[data-presentation="big"] #r-compass,
body[data-presentation="big"] #r-altitude,
body[data-presentation="big"] #r-trip,
body[data-presentation="big"] #r-navinfo,
body[data-presentation="big"] #r-recenter,
body[data-presentation="big"] #navPanel{display:none}

/* kompas & hoogte: alleen in kaart-stand én als voorkeur aan */
#r-compass{display:none}
body[data-presentation="map"][data-compass="on"] #r-compass{display:block}
#r-altitude{display:none}
body[data-presentation="map"][data-altitude="on"] #r-altitude{display:flex}

/* centreerknop: alleen in kaart-stand én als de kaart versleept is */
#r-recenter{display:none}
body[data-presentation="map"][data-dragged="yes"] #r-recenter{display:grid}

/* zoomknoppen (Patch 18): alleen in kaart-stand én terwijl de
   tap-chrome zichtbaar is — bewust ook tijdens een actieve rit. */
#r-zoom{display:none}
body[data-presentation="map"][data-chrome="on"] #r-zoom{display:flex}

/* tap-chrome (Patch 18): in idle zonder tik geen tripeiland; de
   snelheidsmeter verdwijnt alleen als 'altijd tonen' uit staat.
   Tijdens running/paused blijft het eiland altijd staan. Gated op
   kaart-stand zodat groot-getal ongemoeid blijft. */
body[data-presentation="map"][data-measuring="idle"][data-chrome="off"] #r-trip{display:none}
body[data-presentation="map"][data-speedvis="off"][data-measuring="idle"][data-chrome="off"] #r-speed{display:none}

/* 2D/3D-knop: tekstlabel in de fab */
#viewBtn{font-family:"Chakra Petch",sans-serif;font-weight:700;
  font-size:calc(13px * var(--ui));letter-spacing:.04em}

/* ── controlstrip (Patch 13) ─────────────────────────────────
   min = ⋯ + groot-getal; de rest alleen bij data-controls="open".
   Elke knop heeft precies één winnende regel. */
body[data-controls="min"] #setBtn,
body[data-controls="min"] #histBtn,
body[data-controls="min"] #navBtn,
body[data-controls="min"] #viewBtn{display:none}
body[data-controls="open"] #moreBtn{color:var(--amber);border-color:var(--amber)}

/* noord-vast-knop: alleen in kaart-stand, 2D-modus én open rail.
   Bewust de toon-regel uitgebreid i.p.v. een extra verberg-regel:
   zo blijft er één winnende regel en geen specificiteitsgevecht. */
#northBtn{display:none}
body[data-presentation="map"][data-viewmode="2d"][data-controls="open"] #northBtn{display:grid}
body[data-northlock="on"] #northBtn{color:var(--amber);border-color:var(--amber)}
/* nav-info: alleen in kaart-stand tijdens route */
#r-navinfo{display:none}
body[data-presentation="map"][data-nav="route"] #r-navinfo{display:flex}

/* zoekpaneel: alleen in kaart-stand tijdens search (slide via transform) */
body[data-presentation="map"][data-nav="search"] #navPanel{transform:none}

/* schermvullend tikvlak: alleen in groot-getal */
#r-exit{display:none}
body[data-presentation="big"] #r-exit{display:block}

/* groot-getal: snelheid centreren + vergroten; spiegelen alleen hier */
body[data-presentation="big"] #r-speed{grid-area:1 / 1 / -1 / -1;place-self:center;
  background:transparent;border:none;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}
body[data-presentation="big"] #unitBtn{font-size:20px;pointer-events:none}
body[data-presentation="big"][data-mirror="on"] #speedVal{transform:scaleX(-1)}

/* modale overlays */
#settings,#hist,#detail{display:none}
body[data-overlay="settings"] #settings{display:grid}
body[data-overlay="history"] #hist{display:flex}
body[data-overlay="detail"] #detail{display:flex}

/* ═══ LAYOUT A — PORTRET (volledige, op zichzelf staande plattegrond) ═══ */
@media (orientation:portrait){
  :root{--speed-size:72px}
  body[data-presentation="big"]{--speed-size:min(46vw,210px)}

  #ui{
    grid-template-columns:auto 1fr auto;
    grid-template-rows:auto auto auto 1fr auto auto;
    grid-template-areas:
      "controls speed    status"
      "controls altitude compass"
      "controls .        zoom"
      "controls .        recenter"
      "navinfo  navinfo  navinfo"
      "trip     trip     trip";
  }
  #r-controls{grid-area:controls}
  #r-speed{grid-area:speed}
  #r-status{grid-area:status}
  #r-compass{grid-area:compass}
  #r-zoom{grid-area:zoom}
  #r-altitude{grid-area:altitude}
  #r-recenter{grid-area:recenter}
  #r-navinfo{grid-area:navinfo}
  #r-trip{grid-area:trip}

  /* zoekpaneel = bottom sheet */
  #navPanel{position:fixed;left:0;right:0;bottom:0;
    border-radius:var(--radius) var(--radius) 0 0;border-top:1px solid var(--line);
    transform:translateY(110%)}
}

/* ═══ PATCH 19 — SNELHEIDSEILAND INKLAPBAAR (alleen portret-smal) ═══
   max-width:699px sluit Layout C (min-width:700px) hard uit, dus de
   tabletweergave en de Carluex blijven onaangeroerd; orientation
   sluit liggend uit. Alles gegate op data-presentation="map" zodat
   groot-getal zijn eigen geometrie houdt.
   Tunables: --speed-size (26px) en min-width (= kompasbreedte). */
@media (orientation:portrait) and (max-width:699px){

  /* het eiland is tikbaar in béide standen; #unitBtn houdt via de
     handler zijn eigen functie. Let op: hierdoor pant een veeg die
     óp het eiland begint de kaart niet meer — bewuste ruil. */
  body[data-presentation="map"] #r-speed{pointer-events:auto}

  /* er komt één rij bij; rechterkolom wordt status → snelheid → kompas */
  body[data-presentation="map"][data-speedpos="compact"] #ui{
    grid-template-columns:auto 1fr auto;
    grid-template-rows:auto auto auto auto 1fr auto auto;
    grid-template-areas:
      "controls .        status"
      "controls .        speed"
      "controls altitude compass"
      "controls .        zoom"
      "controls .        recenter"
      "navinfo  navinfo  navinfo"
      "trip     trip     trip";
  }

  /* --speed-size op het eiland zélf: erft naar #speedVal en raakt de
     :root-tokens van de andere layouts niet aan. */
  body[data-presentation="map"][data-speedpos="compact"] #r-speed{
    --speed-size:26px;
    justify-self:end;min-width:var(--compass);padding:5px 10px 4px;
    border-radius:14px;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.4)}
  body[data-presentation="map"][data-speedpos="compact"] #unitBtn{
    margin:0;padding:1px 0 0;font-size:9.5px;letter-spacing:.12em}
}

/* ═══ LAYOUT B — LIGGEND (volledige, op zichzelf staande plattegrond) ═══ */
@media (orientation:landscape){
  :root{--speed-size:46px}
  body[data-presentation="big"]{--speed-size:min(48vh,230px)}

  #ui{
    grid-template-columns:auto auto 1fr auto;
    grid-template-rows:auto auto auto 1fr auto;
    grid-template-areas:
      "controls speed    .       status"
      "controls .        .       compass"
      "controls .        .       zoom"
      "controls trip     .       recenter"
      "controls trip     navinfo navinfo";
  }
  #r-controls{grid-area:controls}
  #r-speed{grid-area:speed;justify-self:start;min-width:0;padding:6px 18px 8px}
  #r-status{grid-area:status}
  #r-compass{grid-area:compass}
  #r-zoom{grid-area:zoom}
  #r-altitude{display:none}                 /* hoogte-uitlezing alleen relevant in portret */
  #r-recenter{grid-area:recenter}
  #r-navinfo{grid-area:navinfo;justify-self:end;max-width:min(calc(360px * var(--ui)),46vw)}
 #r-trip{grid-area:trip;align-self:end;justify-self:start;width:fit-content;max-width:46vw}
  #r-trip #stats{margin-bottom:8px;gap:5px;grid-template-columns:repeat(4,auto);
    justify-content:space-between;column-gap:calc(18px * var(--ui))}
  #r-trip .stat b{font-size:calc(16.5px * var(--ui))}
  #r-trip .stat span{font-size:calc(10px * var(--ui))}
  #r-trip .btn{padding-top:10px;padding-bottom:10px;font-size:calc(14px * var(--ui))}

  /* in liggend toont hoogte/kompas niet via voorkeur; herstel kompas alleen */
  body[data-presentation="map"][data-altitude="on"] #r-altitude{display:none}

  /* zoekpaneel = linker kolom */
  #navPanel{position:fixed;left:calc(var(--sal) + 10px);right:auto;
    top:calc(var(--sat) + 10px);bottom:calc(var(--sab) + 10px);
    width:min(380px,44vw);border-radius:var(--radius);border:1px solid var(--line);
    transform:translateX(-115%)}
}

   /* ═══ LAYOUT C — HEAD-UNIT (Patch 17, definitief) ═══════════
   #r-island (snelheid + tripbalk) is één flex-kolom linksonder,
   spant rijen 3–5 en kolommen 1–2: linker rand gelijk aan de
   fabs, geen gap tussen de segmenten, en verticale overlap met
   de zoom/recenter-rijen zodat alles in 516 px hoogte past. */
@media (min-width:700px) and (min-height:460px) and (max-resolution:1.5dppx){
  :root{ --ui: 1.7; --speed-size: 40px }

  #ui{
    grid-template-columns:auto auto 1fr auto;
    grid-template-rows:auto auto auto 1fr auto;
    grid-template-areas:
      "controls .      .  status"
      "controls .      .  compass"
      "island   island .  zoom"
      "island   island .  recenter"
      "island   island .  navinfo";
  }

  /* Groot-getal is naast de BMW-teller zinloos. */
  #modeBtn{display:none}

  /* Noord-vast naast de 2D/3D-knop i.p.v. eronder: de open rail
     blijft 5 knoppen hoog en klapt vrij van het eiland uit.
     top = 4 × (fab + gap) lijnt exact uit met de 2D/3D-knop
     (⋯, set, hist, nav, 2D/3D = posities 0–4). Zichtbaarheid
     blijft volledig bij de bestaande body[data-*]-regel. */
 /* Vaste railhoogte van één fab: de uitgeklapte knoppen hangen
     als overflow onder het grid-item en tellen niet mee in de
     rijhoogtes. Rijen 1–2 worden zo uitsluitend door status en
     kompas bepaald — de rechterkolom staat vast, rail open of
     dicht. Knoppen in overflow blijven gewoon klikbaar. */
 /* height beperkt het grid-item tot één fab (rechterkolom-stabiliteit);
     flex-shrink:0 verbiedt de flex-container de knoppen in die hoogte
     samen te persen — ze hangen dan als echte overflow eronder. */
  #r-controls{position:relative;height:var(--fab)}
  #r-controls .fab{flex-shrink:0}
  #northBtn{position:absolute;left:calc(100% + 10px);
    top:calc(4 * (var(--fab) + 10px))}

  /* DE kernregel: wrapper wordt flex-kolom. Wint van de
     display:contents-basisregel omdat dit blok later staat. */
 /* min-width is de tunable voor de eilandbreedte: beide segmenten
     stretchen ernaar, dus Start rit wordt navenant breder. */
  #r-island{grid-area:island;display:flex;flex-direction:column;
    align-self:end;justify-self:start;min-width:calc(160px * var(--ui))}
  /* Basisregels geven de segmenten align-self:start/end mee (grid-
     eigenschap voor portret/liggend); in deze flex-kolom werkt
     align-self op de dwarsas en zou het de breedte-stretch breken.
     Expliciet terug naar stretch: beide segmenten altijd even breed. */
  #r-speed,#r-trip{align-self:stretch}

  /* Bovenste segment: snelheid + eenheid op één regel, alleen
     bovenhoeken rond; trips bovenrand is de scheidslijn. */
 #r-speed{display:flex;align-items:baseline;justify-content:center;gap:10px;
    padding:12px 18px 8px;text-align:left;box-shadow:none;
    border-radius:var(--radius) var(--radius) 0 0;border-bottom:none}
  /* Patch 18: is het tripsegment verborgen (idle, chrome off), dan
     staat de snelheidspil solo → volledige hoeken + onderrand terug. */
  body[data-measuring="idle"][data-chrome="off"] #r-speed{
    border-radius:var(--radius);border-bottom:1px solid var(--line)}
  #unitBtn{margin:0;padding:0 2px;font-size:15px;letter-spacing:.14em}

  /* Onderste segment: stats 2×2 + brede knoppenrij. width/max-width
     overschrijven bewust de fit-content/46vw-regels uit Layout B. */
  #r-trip{width:auto;max-width:none;
    border-radius:0 0 var(--radius) var(--radius)}
  #r-trip #stats{grid-template-columns:repeat(2,1fr);justify-content:normal;
    column-gap:calc(14px * var(--ui));row-gap:8px;margin-bottom:10px}
  #r-trip .stat b{font-size:calc(15px * var(--ui))}
  #r-trip .btn{padding-top:14px;padding-bottom:14px;font-size:calc(14px * var(--ui))}

  /* Nav-eiland: rechts, opgetild van de bodem richting ~3/4
     schermhoogte. 16vh is de tunable voor de hoogte. */
  #r-navinfo{align-self:end;justify-self:end;border-radius:var(--radius);
    margin-bottom:16vh;
    max-width:min(calc(360px * var(--ui)),46vw)}
}
</style>

const t   = k => I18N[lang][k];

/* ── trip-toestand (afgeleid: measuring) ─────────────────── */
const trip = Object.assign(
  { running:false, dist:0, ms:0, max:0, start:0, accSum:0, accN:0 },
  JSON.parse(LS.getItem("rm_trip") || "{}"),
  { running:false }
);

let route = [];
if (trip.ms > 0 && LS.getItem("rm_route_idb") !== "1") {
  try{
    const parsedRoute = JSON.parse(LS.getItem("rm_route") || "[]");
    route = Array.isArray(parsedRoute) ? parsedRoute : [];

}
function measuring(){
  if (trip.running) return (autoPause && isPaused) ? "paused" : "running";
  return trip.ms ? "paused" : "idle";
}

let lastPos = null, lastSample = null, fixBuf = [], dispSpeed = 0;

/* ── diagnose kilometerverlies (Patch 6) ─────────────────────

const tripLoss = {
  accDropM:0,    // meters gereden tijdens acc > 35 (wordt nu overbrugd, niet verworpen)

  gateSkipN:0,   // fixes die de bewegingsdrempel niet haalden
  glitchDropM:0, // meters verworpen via de d > 200-glitchtak
  glitchN:0,
  lastBadPos:null, // laatste slechte-accuracy-fix, alleen voor meting

};

  tripLoss.accDropM = 0; tripLoss.accDropN = 0;

const R = 6371000;
function haversine(a, b){
  const toR = x => x * Math.PI / 180;
  const dLat = toR(b.latitude - a.latitude), dLon = toR(b.longitude - a.longitude);
  const s = Math.sin(dLat/2)**2 +
            Math.cos(toR(a.latitude)) * Math.cos(toR(b.latitude)) * Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(s));
}
const hv = (p, q) => haversine({latitude:p.lat, longitude:p.lon}, {latitude:q.lat, longitude:q.lon});

};

  const s = Math.floor(ms/1000), h = Math.floor(s/3600), m = Math.floor(s%3600/60);
  return h ? `${h}:${String(m).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`
           : `${m}:${String(s%60).padStart(2,"0")}`;
}

/* ── begrensde diagnostische ringbuffer ─────────────────────
   Alleen compacte diagnose-events in geheugen.
   Geen invloed op tripdata, route logging of persistence. */
const DIAG_MAX_EVENTS = 240;
const DIAG_GPS_SAMPLE_MS = 5000;
const DIAG_PERSIST_MS = 5000;
const DIAG_STORAGE_KEY = "rm_diag_v1";

const diagState = {
  events:[],
  seq:0,
  lastGpsSampleAt:0,
  transitions:Object.create(null),
  persistTimer:0,
  persistDirty:false,
  restored:false
};

function diagSafeValue(value, depth = 0){
  if (depth > 3) return "[Max Depth]";

  if (
    value == null ||
    typeof value === "string" ||
    typeof value === "number" ||
    typeof value === "boolean"
  ){
    return value;
  }

  if (value instanceof Error){
    return {
      name:value.name || "Error",
      message:String(value.message || value),
      stack:value.stack
        ? String(value.stack).slice(0, 1600)
        : null
    };
  }

  if (Array.isArray(value)){
    return value
      .slice(0, 20)
      .map(v => diagSafeValue(v, depth + 1));
  }

  if (typeof value === "object"){
    const out = {};
    let n = 0;

    for (const [key, item] of Object.entries(value)){
      if (n >= 30) break;

      try{
        out[key] = diagSafeValue(item, depth + 1);
      } catch(e){
        out[key] = "[unavailable]";
      }

      n++;
    }

    return out;
  }

  return String(value);
}

function diagIsCriticalType(type){
  return (
    type === "js.error" ||
    type === "promise.unhandled" ||
    type === "gps.error" ||
    type === "gps.unsupported" ||
    type === "state.stale" ||
    type === "state.stationary" ||
    type === "state.visibility"
  );
}

function diagPersistNow(){
  if (diagState.persistTimer){
    clearTimeout(diagState.persistTimer);
    diagState.persistTimer = 0;
  }

  if (!diagState.persistDirty){
    return true;
  }

  try{
    const payload = {
      version:1,
      savedAt:new Date().toISOString(),
      seq:diagState.seq,
      events:diagState.events.slice(-DIAG_MAX_EVENTS)
    };

    LS.setItem(
      DIAG_STORAGE_KEY,
      JSON.stringify(payload)
    );

    diagState.persistDirty = false;
    return true;
  } catch(e){
    /* Diagnose-opslag mag de app nooit verstoren. */
    return false;
  }
}

function diagSchedulePersist(immediate=false){
  diagState.persistDirty = true;

  if (immediate){
    diagPersistNow();
    return;
  }

  if (diagState.persistTimer){
    return;
  }

  diagState.persistTimer = setTimeout(() => {
    diagState.persistTimer = 0;
    diagPersistNow();
  }, DIAG_PERSIST_MS);
}

function diagRestore(){
  let parsed;

  try{
    const raw = LS.getItem(DIAG_STORAGE_KEY);
    if (!raw) return 0;

    parsed = JSON.parse(raw);
  } catch(e){
    try{
      LS.removeItem(DIAG_STORAGE_KEY);
    } catch(ignore){}
    return 0;
  }

  if (
    !parsed ||
    !Array.isArray(parsed.events)
  ){
    return 0;
  }

  const restored = parsed.events
    .slice(-DIAG_MAX_EVENTS)
    .filter(event =>
      event &&
      typeof event === "object" &&
      typeof event.type === "string"
    )
    .map(event => diagSafeValue(event));

  diagState.events = restored;

  const maxSeq = restored.reduce(
    (max, event) => {
      const seq = Number(event.seq);
      return Number.isFinite(seq)
        ? Math.max(max, seq)
        : max;
    },
    0
  );

  diagState.seq = Math.max(
    Number(parsed.seq) || 0,
    maxSeq
  );

  diagState.restored = restored.length > 0;

  return restored.length;
}

function diagRemovePersisted(){
  if (diagState.persistTimer){
    clearTimeout(diagState.persistTimer);
    diagState.persistTimer = 0;
  }

  diagState.persistDirty = false;

  try{
    LS.removeItem(DIAG_STORAGE_KEY);
  } catch(e){}
}

function diagAdd(type, data=null){
  const eventType = String(type);

  const event = {
    seq:++diagState.seq,
    at:new Date().toISOString(),
    perf:+performance.now().toFixed(1),
    type:eventType
  };

  if (data != null){
    event.data = diagSafeValue(data);
  }

  diagState.events.push(event);

  if (diagState.events.length > DIAG_MAX_EVENTS){
    diagState.events.splice(
      0,
      diagState.events.length - DIAG_MAX_EVENTS
    );
  }

  diagSchedulePersist(
    diagIsCriticalType(eventType)
  );

  return event;
}

function diagTransition(key, value, data=null){
  const next = String(value);

  if (diagState.transitions[key] === next){
    return false;
  }

  const prev = Object.prototype.hasOwnProperty.call(
    diagState.transitions,
    key
  )
    ? diagState.transitions[key]
    : null;

  diagState.transitions[key] = next;

  diagAdd("state." + key, {
    from:prev,
    to:next,
    ...(data || {})
  });

  return true;
}

function diagGpsFix(c, ts, acc){
  const now = Date.now();

  if (
    diagState.lastGpsSampleAt &&
    now - diagState.lastGpsSampleAt < DIAG_GPS_SAMPLE_MS
  ){
    return;
  }

  diagState.lastGpsSampleAt = now;

  diagAdd("gps.fix", {
    ts,
    lat:Number.isFinite(c.latitude)
      ? +c.latitude.toFixed(5)
      : null,
    lon:Number.isFinite(c.longitude)
      ? +c.longitude.toFixed(5)
      : null,
    acc:Number.isFinite(acc)
      ? +acc.toFixed(1)
      : null,
    speed:Number.isFinite(c.speed)
      ? +c.speed.toFixed(2)
      : null,
    heading:Number.isFinite(c.heading)
      ? +c.heading.toFixed(1)
      : null,
    dispSpeed:Number.isFinite(dispSpeed)
      ? +dispSpeed.toFixed(2)
      : null,
    presentation:state.presentation,
    nav:state.nav
  });
}

function diagSnapshot(){
  return {
    at:new Date().toISOString(),
    visibility:document.visibilityState,
    presentation:state.presentation,
    nav:state.nav,
    overlay:state.overlay,
    following,
    firstFix,
    lastFixAgeMs:lastFixTime
      ? Math.max(0, Date.now() - lastFixTime)
      : null,
    dispSpeed:Number.isFinite(dispSpeed)
      ? +dispSpeed.toFixed(2)
      : null,
    stationary:typeof stationary !== "undefined"
      ? {
          active:stationary.active,
          candidateSince:stationary.candidateSince,
          exitEvidence:stationary.exitEvidence
        }
      : null,
    motion:typeof motion !== "undefined"
      ? {
          hasPos:!!motion.pos,
          hasAnchor:!!motion.anchor,
          bearing:motion.bearing == null
            ? null
            : +motion.bearing.toFixed(1),
          speed:Number.isFinite(motion.speed)
            ? +motion.speed.toFixed(2)
            : null,
          acc:Number.isFinite(motion.acc)
            ? +motion.acc.toFixed(1)
            : null,
          routeMode:motion.routeMode,
          routeAlong:motion.routeAlong == null
            ? null
            : +motion.routeAlong.toFixed(1),
          staleActive:motion.staleActive,
          anchorAgeMs:motion.anchorPerf
            ? Math.max(
                0,
                Math.round(
                  performance.now() - motion.anchorPerf
                )
              )
            : null,
          lastFixPerfAgeMs:motion.lastFixPerf
            ? Math.max(
                0,
                Math.round(
                  performance.now() - motion.lastFixPerf
                )
              )
            : null
        }
      : null
  };
}

function diagFileStamp(date=new Date()){
  return date
    .toISOString()
    .replace(/[:.]/g, "-");
}

function diagExportObject(){
  return {
    format:"RitMeter diagnostics",
    version:1,
    exportedAt:new Date().toISOString(),
    appVersion:$("appVer")
      ? $("appVer").textContent
      : "RitMeter",
    userAgent:navigator.userAgent || null,
    snapshot:diagSnapshot(),
    recoveredFromPreviousSession:diagState.restored,
    maxEvents:DIAG_MAX_EVENTS,
    eventCount:diagState.events.length,
    events:diagState.events.slice(-DIAG_MAX_EVENTS)
  };
}

function diagExportText(){
  return JSON.stringify(
    diagExportObject(),
    null,
    2
  );
}

function diagExportFile(){
  const filename =
    `RitMeter-diagnose-${diagFileStamp()}.json`;

  const file = new File(
    [diagExportText()],
    filename,
    {
      type:"application/json"
    }
  );

  return {
    file,
    filename
  };
}

function diagDownload(){
  const text = diagExportText();

  const blob = new Blob(
    [text],
    {
      type:"application/json"
    }
  );

  const filename =
    `RitMeter-diagnose-${diagFileStamp()}.json`;

  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");

  a.href = url;
  a.download = filename;
  a.rel = "noopener";
  a.style.display = "none";

  document.body.appendChild(a);
  a.click();
  a.remove();

  setTimeout(() => {
    URL.revokeObjectURL(url);
  }, 1000);

  return filename;
}

async function diagShare(){
  /* Neem ook de laatste nog niet geflushte RAM-events mee
     en zet vooraf een recovery-copy veilig. */
  diagPersistNow();

  const { file, filename } = diagExportFile();

  const shareData = {
    title:"RitMeter diagnose",
    text:"RitMeter diagnostisch logbestand",
    files:[file]
  };

  try{
    if (
      typeof navigator.share === "function" &&
      typeof navigator.canShare === "function" &&
      navigator.canShare(shareData)
    ){
      await navigator.share(shareData);

      diagAdd("diag.shared", {
        method:"native-file",
        filename
      });

      return {
        method:"shared",
        filename
      };
    }
  } catch(e){
    if (
      e &&
      e.name === "AbortError"
    ){
      return {
        method:"cancelled",
        filename
      };
    }

    diagAdd("diag.share_error", {
      name:e && e.name
        ? String(e.name)
        : null,
      message:e && e.message
        ? String(e.message)
        : null
    });
  }

  const downloaded = diagDownload();

  diagAdd("diag.shared", {
    method:"download",
    filename:downloaded
  });

  return {
    method:"download",
    filename:downloaded
  };
}

  get(){

    }));

      0,
      Math.min(
        DIAG_MAX_EVENTS,

      )
    );

});

/* ── IndexedDB ───────────────────────────────────────────── */
let dbP = null;
function db(){
  if (!dbP) dbP = new Promise((res, rej) => {
    const rq = indexedDB.open("ritmeter", 1);
    rq.onupgradeneeded = () => rq.result.createObjectStore("trips", { keyPath:"id" });
    rq.onsuccess = () => res(rq.result);
    rq.onerror   = () => rej(rq.error);
  });
  return dbP;
}
const txs = (d, mode) => d.transaction("trips", mode).objectStore("trips");
const idbPut = rec => db().then(d => new Promise((res, rej) => {
  const r = txs(d, "readwrite").put(rec); r.onsuccess = res; r.onerror = () => rej(r.error);
}));
const idbAll = () => db().then(d => new Promise((res, rej) => {
  const r = txs(d, "readonly").getAll(); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
}));
const idbGet = id => db().then(d => new Promise((res, rej) => {
  const r = txs(d, "readonly").get(id); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
}));
/* Patch 8a: idbDel ontbrak volledig in het bestand, terwijl
   clearPersistedRoute() en het verwijderen van een rit in de
   historie hem wél aanroepen (ReferenceError). */
const idbDel = id => db().then(d => new Promise((res, rej) => {
  const r = txs(d, "readwrite").delete(id); r.onsuccess = res; r.onerror = () => rej(r.error);
}));
/* ── robuuste route-persistentie (Patch 7) ──────────────────
   localStorage is op iOS beperkt (~5 MB origin-totaal). Lange
   ritten schakelen automatisch en permanent (per rit) over op
   IndexedDB. Een mislukte save mag nooit stil blijven of de
   app breken. */
const ROUTE_LS_MAX_CHARS = 1500000;   // ~1,5 MB: ruim onder het iOS-quotum
const ROUTE_IDB_ID = "rm_route_inprogress";
let routePersistLast = 0;
/* Patch 8b: transactionele LS→IDB-migratie.
   - routeSaveSeq: volgnummer per gestarte save; commit-side-effects
     (rm_route wissen) gebeuren alleen voor de nieuwste save.
   - routeSaveChain: serialiseert alle IDB-writes zodat een trage,
     oudere write nooit een nieuwere route kan overschrijven. */
let routeSaveSeq = 0;
let routeSaveChain = Promise.resolve();

function persistRoute(force=false){
  const now = Date.now();

  /* Grote routes niet vaker dan eens per 60 s serialiseren;
     kleine routes en geforceerde flushes (stop/pagehide) altijd. */
  if (!force && route.length > 4000 && now - routePersistLast < 60000) return;
  routePersistLast = now;

  if (LS.getItem("rm_route_idb") !== "1"){
    const json = JSON.stringify(route);

    if (json.length <= ROUTE_LS_MAX_CHARS){
      try{
        LS.setItem("rm_route", json);
        return;
      } catch(e){
        diagAdd("route.ls_failed", { chars:json.length, points:route.length });
      }
    } else {
      diagAdd("route.idb_switch", { chars:json.length, points:route.length });
    }
    /* Belangrijk: hier NIET de vlag zetten en NIET rm_route wissen.
       Dat gebeurt pas hieronder, nadat de IDB-write is bevestigd.
       Tot die tijd blijft de laatste LS-kopie het herstelpunt. */
  }

  /* Snapshot op dit moment: de async write mag niet afhangen van
     latere mutaties van `route` (ondiepe kopie; punten muteren niet). */
  const seq = ++routeSaveSeq;
  const snapshot = route.slice();

  routeSaveChain = routeSaveChain
    .then(() => idbPut({ id:ROUTE_IDB_ID, points:snapshot, savedAt:now }))
    .then(() => {
      /* COMMIT: write is bevestigd. Alleen de nieuwste save mag
         zijeffecten uitvoeren; een verouderde write (er is intussen
         een nieuwere gestart, of clearPersistedRoute() draaide) mag
         de vlag niet (opnieuw) zetten of LS opruimen. Overslaan is
         veilig: de nieuwere save in de keten commit direct hierna. */
      if (seq !== routeSaveSeq) return;
      if (LS.getItem("rm_route_idb") !== "1"){
        try{ LS.setItem("rm_route_idb", "1"); } catch(e){
          /* Vlag zetten mislukt: LS-kopie blijft staan; bij herstart
             wordt dan de (iets oudere) LS-route geladen — geen verlies
             van de vlagloze toestand, alleen van dit ene interval. */
        }
        diagAdd("route.idb_committed", { points:snapshot.length });
      }
      /* Oude LS-kopie pas na bevestigde write opruimen. */
      try{ LS.removeItem("rm_route"); } catch(e){}
    })
    .catch(err => {
      diagAdd("route.idb_failed", {
        points:snapshot.length,
        error: err && err.name ? String(err.name) : String(err)
      });
      /* Fallback: als de migratie nog niet gecommit is, probeer de
         actuele route alsnog in localStorage te zetten — ook boven de
         soft-limiet; het echte quotum ligt hoger. Beter een geslaagde
         te-grote LS-write dan niets. */
      if (seq === routeSaveSeq && LS.getItem("rm_route_idb") !== "1"){
        try{
          LS.setItem("rm_route", JSON.stringify(route));
          diagAdd("route.ls_fallback_ok", { points:route.length });
        } catch(e){
          diagAdd("route.ls_fallback_failed", { points:route.length });
        }
      }
    });
}

function clearPersistedRoute(){
  /* Maak eventueel nog lopende writes "oud" zodat hun commit-stap
     geen zijeffecten meer heeft… */
  routeSaveSeq++;
  try{ LS.removeItem("rm_route"); } catch(e){}
  try{ LS.removeItem("rm_route_idb"); } catch(e){}
  /* …en hang de delete ACHTER de write-keten, zodat een trage write
     het record niet ná de delete opnieuw kan aanmaken. */
  routeSaveChain = routeSaveChain
    .catch(()=>{})
    .then(() => idbDel(ROUTE_IDB_ID))
    .catch(err => diagAdd("route.idb_clear_failed", {
      error: err && err.name ? String(err.name) : String(err)
    }));
}

/* Herstel van een lopende grote rit na PWA-herstart (Patch 8b).
   De vlag rm_route_idb="1" wordt sinds Patch 8b pas gezet ná een
   bevestigde IDB-write, maar oudere installaties of IDB-evictie
   door het OS kunnen alsnog een inconsistente toestand opleveren:
   vlag staat, record ontbreekt. Dan vallen we terug op een
   eventueel nog aanwezige localStorage-kopie. */
function restoreRouteFromLS(reason){
  try{
    const parsed = JSON.parse(LS.getItem("rm_route") || "[]");
    if (Array.isArray(parsed) && parsed.length){
      route = parsed.concat(route);
      diagAdd("route.restore_ls_fallback", { reason, points:parsed.length });
      /* Migratiestatus terugdraaien: de route leeft weer in LS,
         persistRoute() migreert vanzelf opnieuw zodra dat nodig is. */
      try{ LS.removeItem("rm_route_idb"); } catch(e){}
      return true;
    }
  } catch(e){}
  diagAdd("route.restore_none", { reason });
  return false;
}
if (trip.ms > 0 && LS.getItem("rm_route_idb") === "1"){
  idbGet(ROUTE_IDB_ID).then(rec => {
    if (rec && Array.isArray(rec.points) && rec.points.length){
      route = rec.points.concat(route);
      diagAdd("route.restore_idb", { points:rec.points.length });
      /* Eventuele verweesde (oudere) LS-kopie opruimen: IDB is nieuwer. */
      try{ LS.removeItem("rm_route"); } catch(e){}
    } else {
      restoreRouteFromLS("idb_record_missing");
    }
  }).catch(err => {
    diagAdd("route.restore_idb_error", {
      error: err && err.name ? String(err.name) : String(err)
    });
    restoreRouteFromLS("idb_open_failed");
  });
}

/* ═══ HET RENDER-CONTRACT ══════════════════════════════════
   1) body-data-attributen uit state  2) inhoud  3) kaart-padding
   Niets anders in de app raakt zichtbaarheid aan.            */
function render(){
  const b = document.body;
  b.dataset.presentation = state.presentation;
  b.dataset.mirror       = state.mirror ? "on" : "off";
  b.dataset.nav          = state.nav;          /* CSS gate't dit achter data-presentation="map" */

  b.dataset.overlay      = state.overlay;
  b.dataset.compass      = showCompass  ? "on" : "off";
  b.dataset.altitude     = showAltitude ? "on" : "off";
  b.dataset.dragged      = following ? "no" : "yes";
  b.dataset.viewmode     = viewMode;
  b.dataset.northlock    = northLocked() ? "on" : "off";
 b.dataset.controls     = state.controls;
  b.dataset.chrome       = state.chrome;
  b.dataset.speedvis     = speedAlways ? "on" : "off";
  b.dataset.speedpos     = state.speedPos;   /* Patch 19 */
  b.dataset.theme        = themeNow;         /* Patch 20: 'day' | 'night' */
  $("viewBtn").textContent = viewMode === "3d" ? "3D" : "2D";
  document.documentElement.style.setProperty("--digit", COLORS[digitColor]);

  /* snelheid */
  const sv = $("speedVal");
  sv.textContent = firstFix ? fmtSpeed(dispSpeed) : "--";
  sv.classList.toggle("moving", dispSpeed > .4);
  $("unitBtn").textContent = unitLbl();

  /* trip-cijfers */
  $("stDist").textContent = fmtDist(trip.dist);
  $("stTime").textContent = fmtTime(trip.ms);
  const avg = trip.ms > 3000 ? trip.dist / (trip.ms/1000) : 0;
  $("stAvg").textContent  = fmtSpeed(avg);
  $("stMax").textContent  = fmtSpeed(trip.max);
  $("stDistU").textContent = useMph ? "mi" : "km";
  $("stTimeU").textContent = t("time") + (trip.running && isPaused && autoPause ? " ⏸" : "");
  $("stAvgU").textContent  = t("avg") + " " + unitLbl();
  $("stMaxU").textContent  = t("max") + " " + unitLbl();
  $("startBtn").textContent = trip.running ? t("stop") : (trip.ms ? t("resume") : t("start"));
  $("startBtn").className   = "btn " + (trip.running ? "halt" : "go");
  $("resetBtn").textContent = trip.dist >= 100 ? t("save_reset") : t("reset");
  $("resetBtn").disabled    = trip.running || !trip.ms;

  /* hoogte & koers (uitlezing) */
  const napAlt = lastAltRaw == null ? null : lastAltRaw - altOffset;
  $("lblAlt").textContent = lastLat == null ? t("alt")
    : inNL(lastLat, lastLon) ? t("alt_nap") : t("alt_msl");
  $("altVal").textContent = napAlt == null ? "—"
    : useMph ? Math.round(napAlt * 3.28084) + " ft" : Math.round(napAlt) + " m";
    const displayBearing =
    bearingState.marker ??
    lastBearing;

  $("hdgVal").textContent = displayBearing == null ? "—"
    : Math.round(displayBearing) + "° " + cardinal(displayBearing);

  if (displayBearing != null){
    $("roseG").style.transform =
      `rotate(${-displayBearing}deg)`;
  }

  /* nav-info-regel (resterende afstand + rijtijd + aankomsttijd) */
  if (state.nav === "route" && nav.coords.length){
    $("navInfoTxt").innerHTML =
      `<b>${fmtNavDist(nav.remM)}</b> &middot; ${fmtEta(nav.remEtaS)}` +
      ` &middot; ${t("eta")} <b>${fmtArrival(nav.remEtaS)}</b>`;
  }

  /* groot-getal-hint */
  $("exitHint").textContent = t("exit_hint");
}

/* kaart-padding uit de werkelijke hoogte van het zichtbare onderpaneel */
function applyMapPadding(){
  if (!map || !mapReady) return;
  const headUnit = matchMedia(
    "(min-width:700px) and (min-height:460px) and (max-resolution:1.5dppx)").matches;
  const land = matchMedia("(orientation: landscape)").matches;
  const tripH = state.presentation === "map" ? ($("r-trip").offsetHeight || 0) : 0;
  const panelOpen = state.presentation === "map" && state.nav === "search";
  let pad;
 if (headUnit){
    /* Patch 16 (Layout C v2): het eiland zit linksonder en het
       nav-eiland rechtsonder-opgetild — het bodemmidden is vrij,
       dus de bottom-padding kan laag en hoeft de eilandhoogte niet
       meer te volgen. 3D/koersmodus: marker iets ónder het midden
       (meer kaart vóór je); de bestaande noord-vast-regel onderaan
       (pad.top = pad.bottom) centreert in 2D+noord-vast vanzelf
       exact, conform gewenst. Tunables: 0.28 (hoe lager de marker
       in 3D, hoe hoger deze factor) en 64 (bodemmarge). */
    pad = {
      top: Math.round(innerHeight * 0.28),
      bottom: 64,
      left: panelOpen ? Math.min(380, Math.round(innerWidth*0.44)) + 20 : 110,
      right: 78
    };
  } else if (land){
    const left = panelOpen ? Math.min(380, Math.round(innerWidth*0.44)) + 20 : 130;
    pad = { top: Math.round(innerHeight*0.42), bottom: tripH ? tripH + 22 : 60, left, right:60 };
 } else {
    const top = Math.round((state.presentation === "map" ? 0.58 : 0.45) * innerHeight);
    /* tijdens navigatie telt de navinfo-balk mee + extra marge, zodat de
       positiedriehoek hoger komt te staan en er meer kaart onder zichtbaar is */
    const navH = (state.presentation === "map" && state.nav === "route")
      ? ($("r-navinfo").offsetHeight || 0) + 34 : 0;
    const bottom = panelOpen ? Math.round(innerHeight*0.40) : (tripH ? tripH + navH + 22 : navH + 120);
    pad = { top, bottom, left:24, right:24 };
  }
  /* Patch 10b: bij noord-vast staat de marker gecentreerd in het
     zichtbare kaartvlak i.p.v. onderin, zodat er bij zuidwaarts
     rijden ook kaart vóór je zichtbaar blijft. */
  if (state.presentation === "map" && northLocked()){
    pad.top = pad.bottom;
  }
  map.setPadding(pad);
}

const STYLE_NIGHT = "https://tiles.openfreemap.org/styles/dark";

/* ═══ PATCH 20 — DAG/NACHT ═══════════════════════════════════
   Beide OpenFreeMap-stijlen delen dezelfde vector-tilesource
   (tiles.openfreemap.org/planet), dus een stijlwissel kost alleen
   de stijl-JSON + sprite — je tegelcache blijft volledig geldig.

   Offline-vangnet: de stijl-JSON wordt als object opgehaald,
   gevalideerd en in localStorage bewaard. Mislukt dat, dan blijft de
   huidige stijl gewoon staan (zichtbaar in het diagnoselog). Nooit
   een zwarte kaart door een mislukte setStyle. */
function getSunTimes(lat, lon, date, altitudeDeg){
  const rad = Math.PI / 180, dayMs = 86400000, J1970 = 2440588, J2000 = 2451545;
  const toJulian   = d => d.valueOf() / dayMs - 0.5 + J1970;
  const fromJulian = j => new Date((j + 0.5 - J1970) * dayMs);
  const e = rad * 23.4397;
  const eclipticLongitude = M =>
    M + rad * (1.9148 * Math.sin(M) + 0.02 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M))
      + rad * 102.9372 + Math.PI;
  const J0 = 0.0009;
  const solarTransitJ = (ds, M, L) => J2000 + ds + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * L);

  const lw = rad * -lon, phi = rad * lat, d = toJulian(date) - J2000;
  const n  = Math.round(d - J0 - lw / (2 * Math.PI));
  const ds = J0 + lw / (2 * Math.PI) + n;
  const M  = rad * (357.5291 + 0.98560028 * ds);
  const L  = eclipticLongitude(M);
  const dec = Math.asin(Math.sin(e) * Math.sin(L));
  const Jnoon = solarTransitJ(ds, M, L);
  const cosW = (Math.sin(rad * altitudeDeg) - Math.sin(phi) * Math.sin(dec))
             / (Math.cos(phi) * Math.cos(dec));
  if (!(cosW >= -1 && cosW <= 1)) return null;      // poolnacht of pooldag
  const w = Math.acos(cosW);
  const Jset = solarTransitJ(J0 + (w + lw) / (2 * Math.PI) + n, M, L);
  return { sunrise: fromJulian(Jnoon - (Jset - Jnoon)), sunset: fromJulian(Jset) };
}

function effectiveTheme(){
  if (themeMode === "day" || themeMode === "night") return themeMode;
  if (lastLat != null && lastLon != null){
    const d = new Date();
    /* twee aparte berekeningen: de avonddrempel bepaalt wanneer het
       nacht wordt, de ochtenddrempel wanneer het weer dag wordt. */
    const dusk = getSunTimes(lastLat, lastLon, d, SUN_ALT_DUSK);
    const dawn = getSunTimes(lastLat, lastLon, d, SUN_ALT_DAWN);
    if (dusk && dawn){
      const now = d.getTime();
      return (now < dawn.sunrise.getTime() || now > dusk.sunset.getTime())
        ? "night" : "day";
    }
  }
  /* geen fix (of poolgebied): volg het systeemthema van de head unit */
  return matchMedia("(prefers-color-scheme: dark)").matches ? "night" : "day";
}

const styleJSON = { day:null, night:null };
const styleKey  = which => which === "night" ? "rm_style_night" : "rm_style_day";
const styleUrl  = which => which === "night" ? STYLE_NIGHT : STYLE_DAY;

/* Synchroon uit geheugen of localStorage; null als we hem niet hebben. */
function cachedStyle(which){
  if (styleJSON[which]) return styleJSON[which];
  try{
    const c = JSON.parse(LS.getItem(styleKey(which)));
    if (c && c.version === 8 && Array.isArray(c.layers) && c.layers.length){
      styleJSON[which] = c;
      return c;
    }
  }catch(err){}
  return null;
}
