<!DOCTYPE html>
<!-- ══════════════════════════════════════════════════════════════
     Deze pagina is alleen de schil. De code staat in src/css en
     src/js en wordt hieronder in vaste volgorde ingeladen.

     De volgorde is functioneel, niet cosmetisch:
       - CSS  : de cascade bepaalt welke layout wint (A/B/C).
       - JS   : klassieke scripts delen één globale scope, maar
                functies hijsen NIET over bestandsgrenzen heen.
                Een bestand mag dus alleen aanroepen wat eerder
                is ingeladen. 90-boot.js draait als laatste.

     Nieuw bestand? Voeg het hier toe én in SHELL in sw.js,
     anders start de app niet meer offline.
     ══════════════════════════════════════════════════════════════ -->
<!-- temporary comments: new commit due to Github outtage -->
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B0F14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RitMeter">
<title>RitMeter — GPS snelheid &amp; trip</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<link rel="stylesheet" href="./src/css/00-tokens.css">
<link rel="stylesheet" href="./src/css/10-map.css">
<link rel="stylesheet" href="./src/css/20-ui-grid.css">
<link rel="stylesheet" href="./src/css/30-regions.css">
<link rel="stylesheet" href="./src/css/40-visibility.css">
<link rel="stylesheet" href="./src/css/50-layout-portrait.css">
<link rel="stylesheet" href="./src/css/60-layout-landscape.css">
<link rel="stylesheet" href="./src/css/70-panels.css">
<link rel="stylesheet" href="./src/css/80-toast.css">
<link rel="stylesheet" href="./src/css/90-layout-c.css">
</head>
<body data-presentation="map" data-nav="off" data-overlay="none" data-mirror="off"
      data-compass="on" data-altitude="off" data-measuring="idle" data-dragged="no"
      data-viewmode="3d" data-northlock="off" data-chrome="on" data-speedvis="on"
      data-speedpos="full">

<div id="map"></div>

<!-- ═══ UI-overlay: alle regio's in één grid ═══ -->
<div id="ui">

  <div id="r-controls">
    <button id="moreBtn" class="fab" aria-label="meer knoppen">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
    </button>
    <button id="modeBtn" class="fab" aria-label="groot getal">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg>
    </button>
    <button id="setBtn" class="fab" aria-label="instellingen">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
    <button id="histBtn" class="fab" aria-label="geschiedenis">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
    </button>
    <button id="navBtn" class="fab" aria-label="navigatie">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>
    </button>
    <button id="viewBtn" class="fab" aria-label="2D/3D-weergave">3D</button>
    <button id="northBtn" class="fab" aria-label="noorden vastzetten">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6l3 8-3-2-3 2z" fill="currentColor" stroke="none"/></svg>
    </button>
  </div>

  <!-- Patch 17: eiland-wrapper. Buiten Layout C display:contents
       (structureel onzichtbaar); in Layout C één flex-kolom. -->
 <div id="r-island">
  <div id="r-speed">
    <div id="speedVal">--</div>
    <button id="unitBtn" aria-label="eenheid">km/u</button>
  </div>
  <div id="r-trip">
    <div id="stats">
      <div class="stat"><b id="stDist">0,00</b><span id="stDistU">km</span></div>
      <div class="stat"><b id="stTime">0:00</b><span id="stTimeU">tijd</span></div>
      <div class="stat"><b id="stAvg">0</b><span id="stAvgU">gem km/u</span></div>
      <div class="stat"><b id="stMax">0</b><span id="stMaxU">max km/u</span></div>
    </div>
    <div id="btnRow">
      <select id="vehSel" aria-label="voertuig voor deze rit"></select>
      <button id="startBtn" class="btn go">Start rit</button>
      <button id="resetBtn" class="btn" disabled>Reset</button>
      <button id="discardBtn" class="btn warn" aria-label="rit weggooien">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v5M14 11v5"/></svg>
      </button>
    </div>
  </div>
  </div><!-- /#r-island -->
  <div id="r-status"><span id="gpsDot"></span><span id="gpsTxt">GPS…</span></div>
  <div id="r-compass"><svg viewBox="0 0 60 60">
    <g id="roseG">
      <circle cx="30" cy="30" r="24" fill="none" stroke="#22303E"/>
      <line x1="13" y1="30" x2="47" y2="30" stroke="#3A4854" stroke-width="2"/>
      <path d="M30 7 L35 30 L25 30 Z" fill="#FF5252"/>
      <path d="M30 53 L35 30 L25 30 Z" fill="#55636F"/>
      <circle cx="30" cy="30" r="2.4" fill="#0B0F14" stroke="#3A4854"/>
      <text id="rN" class="n" x="30" y="20" text-anchor="middle">N</text>
      <text id="rE" x="49" y="33" text-anchor="middle">O</text>
      <text id="rS" x="30" y="51" text-anchor="middle">Z</text>
      <text id="rW" x="11" y="33" text-anchor="middle">W</text>
    </g>
    <path d="M30 2 L34 9 L26 9 Z" fill="#FFB300"/>
  </svg></div>
  <div id="r-zoom">
    <div id="zoomLvl" aria-hidden="true"><span id="zoomLvlNum"></span><span class="sub" id="zoomLvlSub"></span></div>
    <button id="zoomIn" class="fab" aria-label="inzoomen">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button id="zoomOut" class="fab" aria-label="uitzoomen">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14"/></svg>
    </button>
  </div>
  <div id="r-altitude">
    <span><span class="lbl" id="lblAlt">hoogte</span><span id="altVal">—</span></span>
    <span><span class="lbl" id="lblHdg">koers</span><span id="hdgVal">—</span></span>
  </div>
  <button id="r-recenter" class="fab" aria-label="centreren">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3.5M12 18.5V22M2 12h3.5M18.5 12H22"/></svg>
  </button>
  <div id="r-navinfo">
    <span class="nf" id="navInfoTxt">—</span>
    <button id="navRecalc" aria-label="herbereken">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
    </button>
    <button id="navStopBtn" aria-label="stop navigatie">×</button>
  </div>
</div><!-- /#ui -->

<!-- schermvullend tikvlak om uit groot-getal te keren -->
<button id="r-exit" aria-label="terug naar kaart"><span id="exitHint"></span></button>

<!-- zoekpaneel (alleen kaart-stand, nav=search) -->
<div id="navPanel">
  <div class="navGrip"></div>
  <div class="navTop">
    <input id="navSearch" type="search" inputmode="search" autocomplete="off"
           autocapitalize="off" spellcheck="false" placeholder="Zoek bestemming">
    <button id="navClose" class="navX" aria-label="sluiten">×</button>
  </div>
  <div id="navResults"></div>
  <div id="navFavs"></div>
  <div id="navInfoPanel" class="navInfo"></div>
  <div class="navBtns">
    <button id="navStart" disabled>Start navigatie</button>
    <button id="navSaveFav" aria-label="opslaan"><svg width="22" height="22" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3.3l2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.6 6.8 19.3l1-5.8L3.6 9.4l5.8-.8z"/></svg></button>
  </div>
</div>

<!-- geschiedenis -->
<div id="hist" class="page">
  <div class="pageHead">
    <button id="histClose" class="fab" aria-label="sluiten">←</button>
    <h2 id="histTitle">Geschiedenis</h2>
  </div>
  <div class="pageBody">
    <div id="histActs">
      <button id="bakBtn" class="hbtn"></button>
      <button id="resBtn" class="hbtn"></button>
      <button id="gpxAllBtn" class="hbtn"></button>
      <input type="file" id="resFile" accept=".json,application/json" hidden>
    </div>
    <div id="histTabs">
      <button id="tabRides" class="on"></button><button id="tabStats"></button>
    </div>

    <div id="paneRides">
      <div id="histTotals"></div>
      <div id="histList"></div>
      <p id="histEmpty"></p>
    </div>

    <div id="paneStats" hidden>
      <div id="statVeh"></div>
      <div id="statTotals"></div>
      <h3 id="statWeeksTitle" class="statHead"></h3>
      <div id="statWeeks"></div>
      <h3 id="statRecordsTitle" class="statHead"></h3>
      <div id="statRecords"></div>
      <p id="statEmpty"></p>
    </div>
  </div>
</div>

<!-- ritdetail -->
<div id="detail" class="page">
  <div class="pageHead">
    <button id="detBack" class="fab" aria-label="terug">←</button>
    <h2 id="detTitle"></h2>
  </div>
  <div class="pageBody">
    <div id="detStats"></div>
    <div id="dmap"></div>
    <div id="profWrap">
      <h3 id="lblProfile">Hoogteprofiel</h3>
      <canvas id="profile"></canvas>
      <p id="profNote"></p>
    </div>
    <div class="actRow">
      <button id="shareBtn">Deel als GPX</button>
      <button id="delBtn">Verwijder</button>
    </div>
  </div>
</div>

<!-- instellingen -->
<div id="settings"><div id="setCard">
  <h2 id="setTitle">Instellingen</h2>

  <div class="row">
    <div class="info"><b id="lblLang">Taal</b><span id="dscLang"></span></div>
    <div class="seg"><button id="langNL">NL</button><button id="langEN">EN</button></div>
  </div>

  <div class="row">
    <div class="info"><b id="lblUnit">Eenheid</b><span id="dscUnit"></span></div>
    <div class="seg"><button id="unitKm">km/u</button><button id="unitMi">mph</button></div>
  </div>

  <div class="row" style="flex-direction:column;align-items:stretch">
    <div class="info" style="margin-bottom:10px"><b id="lblVeh">Voertuig</b><span id="dscVeh"></span></div>
    <div id="vehSeg">
      <button data-p="car">Auto</button>
      <button data-p="bike">Fiets</button>
      <button data-p="moped">Bromfiets</button>
      <button data-p="snor">Snorfiets</button>
      <button data-p="foot">Te voet</button>
    </div>
  </div>

 <div class="row">
    <div class="info"><b id="lblCompass"></b><span id="dscCompass"></span></div>
    <button id="compassSw" class="switch" role="switch"></button>
  </div>

  <div class="row">
    <div class="info"><b id="lblSpeedVis"></b><span id="dscSpeedVis"></span></div>
    <button id="speedSw" class="switch" role="switch"></button>
  </div>

  <div class="row">
    <div class="info"><b id="lblAltitude"></b><span id="dscAltitude"></span></div>
    <button id="altSw" class="switch" role="switch"></button>
  </div>

  <div class="row">
    <div class="info"><b id="lblAltCal"></b><span id="dscAltCal"></span></div>
    <div class="seg"><button id="altCalBtn"></button><button id="altCalReset"></button></div>
  </div>

  <div class="row">
    <div class="info"><b id="lblColor"></b><span id="dscColor"></span></div>
    <div class="swatches">
      <button id="colAmber" class="sw" style="background:#FFB300"></button>
      <button id="colWhite" class="sw" style="background:#E9EEF3"></button>
      <button id="colGreen" class="sw" style="background:#34E07A"></button>
    </div>
  </div>

  <div class="row">
    <div class="info"><b id="lblMirror"></b><span id="dscMirror"></span></div>
    <button id="mirrorSw" class="switch" role="switch"></button>
  </div>

  <div class="row">
    <div class="info"><b id="lblAP"></b><span id="dscAP"></span></div>
    <button id="apSw" class="switch" role="switch"></button>
  </div>

   <div class="row">
    <div class="info"><b id="lblTheme"></b><span id="dscTheme"></span></div>
    <div class="seg">
      <button id="thDay"></button><button id="thNight"></button><button id="thAuto"></button>
    </div>
  </div>

  <div class="row">
    <div class="info">
      <b id="lblDiag"></b>
      <span id="dscDiag"></span>
    </div>
    <div class="seg">
      <button id="diagShareBtn"></button>
      <button id="diagClearBtn"></button>
    </div>
  </div>

   <button id="setClose">Sluiten</button>
  <p id="appVer" style="text-align:center;color:#7E8B98;font-size:12px;margin:14px 0 0">RitMeter</p>
</div></div>

<div id="dim"></div>
<div id="toast"></div>

<div id="notice"><div class="card">
  <h2 id="ntcTitle"></h2><p id="ntcText"></p><button id="ntcBtn"></button>
</div></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="./src/js/00-state.js"></script>
<script src="./src/js/05-i18n.js"></script>
<script src="./src/js/10-trip.js"></script>
<script src="./src/js/15-helpers.js"></script>
<script src="./src/js/20-diag.js"></script>
<script src="./src/js/25-storage.js"></script>
<script src="./src/js/30-render.js"></script>
<script src="./src/js/35-map-theme.js"></script>
<script src="./src/js/40-motion.js"></script>
<script src="./src/js/45-camera.js"></script>
<script src="./src/js/50-map-init.js"></script>
<script src="./src/js/55-gps.js"></script>
<script src="./src/js/60-clock.js"></script>
<script src="./src/js/65-history.js"></script>
<script src="./src/js/70-settings.js"></script>
<script src="./src/js/75-handlers.js"></script>
<script src="./src/js/80-nav.js"></script>
<script src="./src/js/90-boot.js"></script>
</body>
</html>
