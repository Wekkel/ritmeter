/* Zelfde vorm als liberty's building-3d, maar met nachtkleuren en een
   hoogteramp zodat hoge panden oplichten. minzoom 15 i.p.v. 14 houdt het
   licht voor de head unit; verhoog naar 16 als het gaat schokken. */
function night3dLayer(){
  return {
    id:"building-3d", type:"fill-extrusion",
    source:"openmaptiles", "source-layer":"building",
    minzoom:15,
    /* has-check plus coalesce: zonder render_height zou de interpolate
       een null binnenkrijgen en een expressiefout geven. */
    filter:["all", ["!=", ["get","hide_3d"], true], ["has","render_height"]],
    paint:{
      "fill-extrusion-color":["interpolate", ["linear"],
        ["coalesce", ["get","render_height"], 0],
        0, NIGHT.build3dLow, 60, NIGHT.build3dHigh],
      "fill-extrusion-height":["coalesce", ["get","render_height"], 0],
      "fill-extrusion-base":["coalesce", ["get","render_min_height"], 0],
      "fill-extrusion-opacity":.85
    }
  };
}

/* Patch 22: een eigen contourlijn. fill-outline-color van de building-
   laag is altijd exact 1 device-pixel en verdrinkt op een hoge-dpi
   scherm; een echte line-laag schaalt met de zoom en leest daardoor
   ook in 2D. Blijft bewust dun en halftransparant — contour, geen
   markering. Tunables: line-width en line-opacity. */
function nightBuildingOutline(){
  return {
    id:"building-outline-night", type:"line",
    source:"openmaptiles", "source-layer":"building",
    minzoom:14,
    filter:["match", ["geometry-type"], ["MultiPolygon","Polygon"], true, false],
    paint:{
      "line-color":NIGHT.buildEdge,
      "line-width":["interpolate", ["linear"], ["zoom"], 14,.4, 16,.7, 19,1.2],
      "line-opacity":["interpolate", ["linear"], ["zoom"], 14,.35, 16,.75]
    }
  };
}

function nightify(style){
  const s = JSON.parse(JSON.stringify(style));       // cache nooit muteren
  for (const layer of s.layers){
    const ov = NIGHT_PAINT[layer.id];
    if (ov) layer.paint = Object.assign({}, layer.paint, ov);
  }
  /* contour direct boven de footprint-vulling */
  const bi = s.layers.findIndex(l => l.id === "building");
  if (bi >= 0 && !s.layers.some(l => l.id === "building-outline-night"))
    s.layers.splice(bi + 1, 0, nightBuildingOutline());
  if (!s.layers.some(l => l.type === "fill-extrusion")){
    /* boven de wegen, onder de labels: highway_name_other is in
       dark-matter de eerste weglabel-laag. Ontbreekt die, dan achteraan
       (dan staan panden boven de labels — lelijk, niet fataal). */
    let at = s.layers.findIndex(l => l.id === "highway_name_other");
    if (at < 0) at = s.layers.length;
    s.layers.splice(at, 0, night3dLayer());
  }
  return s;
}

/* Gebruiksklare stijl: dag = ruw, nacht = hertint. null als niet gecached. */
function themedStyle(which){
  const raw = cachedStyle(which);
  if (!raw) return null;
  return which === "night" ? nightify(raw) : raw;
}

function loadStyleJSON(which){
  const hit = cachedStyle(which);
  if (hit) return Promise.resolve(hit);
  return fetch(styleUrl(which))
    .then(res => { if (!res.ok) throw new Error("HTTP " + res.status); return res.json(); })
    .then(json => {
      if (!json || json.version !== 8 || !Array.isArray(json.layers) || !json.layers.length)
        throw new Error("ongeldige stijl");
      styleJSON[which] = json;
      try{ LS.setItem(styleKey(which), JSON.stringify(json)); }catch(err){}
      return json;
    });
}

let mapStyleApplied = null, styleSwitchBusy = false;
function applyMapTheme(){
  if (!map || !mapReady) return;
  const want = themeNow;
  if (mapStyleApplied === want || styleSwitchBusy) return;
  styleSwitchBusy = true;
  loadStyleJSON(want).then(json => {
    map.setStyle(want === "night" ? nightify(json) : json, { diff:false });
    mapStyleApplied = want;
    diagAdd("theme.style_applied", { theme:want });
    /* De route zit in een eigen source die setStyle weggooit. Pollen
       i.p.v. op styledata vertrouwen: addSource vóór een volledig
       geladen stijl gooit een fout. DOM-markers (positie, bestemming)
       overleven een stijlwissel wel. */
    let tries = 0;
    const restore = () => {
      if (!map) return;
      if (!map.isStyleLoaded()){
        if (++tries > 60){ diagAdd("theme.style_slow", { theme:want }); return; }
        setTimeout(restore, 120); return;
      }
      if (nav.coords.length && !map.getSource("nav-route")) drawNavRoute();
      applyMapPadding();
    };
    setTimeout(restore, 120);
  }).catch(err => {
    diagAdd("theme.style_failed", {
      theme:want, error:String((err && err.message) || err) });
  }).finally(() => { styleSwitchBusy = false; });
}

function applyTheme(){
  const next = effectiveTheme();
  if (next !== themeNow){
    themeNow = next;
    diagAdd("theme.switch", { theme:next, mode:themeMode });
    render();
  }
  applyMapTheme();          /* idempotent: doet niets als de stijl al klopt */
}

/* ── vloeiende visuele positie (30 fps, dead reckoning + foutuitmiddeling) ──
   De ruwe GPS-fix blijft leidend voor ritafstand, logging en off-route-detectie.
   Alleen marker + camera gebruiken deze voorspellende weergavelaag. */
const MOTION_FPS = 30;
const MOTION_FRAME_MS = 1000 / MOTION_FPS;
   
/* Marker en kaartcamera hebben bewust een verschillend tempo.
   De marker blijft vloeiend op maximaal 30 fps bewegen.
   De camera volgt rustiger op maximaal 15 fps en wordt volledig
   geblokkeerd tijdens gebruikersinteractie en knop-zoom. */
const CAMERA_FPS = 15;
const CAMERA_FRAME_MS = 1000 / CAMERA_FPS;
const CAMERA_GESTURE_GRACE_MS = 220;
const CAMERA_BUTTON_ZOOM_BLOCK_MS = 420;

/* ── stationary lock ────────────────────────────────────────
   GPS-fixes van een stilstaand toestel vormen meestal geen exact punt,
   maar een kleine wolk. Na overtuigende stilstand vergrendelen we alleen
   de visuele positie. Ruwe GPS blijft leidend voor logging en navigatie. */
const STATIONARY_WINDOW_MS = 6500;
const STATIONARY_MIN_SPAN_MS = 4800;
const STATIONARY_ENTER_CONFIRM_MS = 2200;

const STATIONARY_SPEED_MAX_MS = 1.15;       // kandidaat stilstand: ~4,1 km/u
const STATIONARY_EXIT_SPEED_MS = 1.65;      // duidelijke beweging: ~5,9 km/u

const STATIONARY_RADIUS_MIN_M = 4.5;
const STATIONARY_RADIUS_MAX_M = 11;

const STATIONARY_EXIT_DIST_MIN_M = 7;
const STATIONARY_EXIT_DIST_MAX_M = 18;
const STATIONARY_EXIT_CONFIRM_FIXES = 2;
/* ── bearing / horizon smoothing ────────────────────────────
   Positie, markerkoers en camerakoers hebben bewust verschillende
   filters. Vooral bij wandelen is een koers uit enkele meters GPS-
   verplaatsing te ruisachtig om direct de 3D-camera te draaien. */

/* Minimale snelheid voor betrouwbare koersverwerking. */
const BEARING_MIN_SPEED_MS = 0.9;

/* Bewegingsbasis voor GPS-afgeleide koers.
   Bij lage snelheid gebruiken we een veel langere basis. */
const BEARING_WALK_BASE_MIN_M = 9;
const BEARING_WALK_BASE_MAX_M = 22;
const BEARING_VEHICLE_BASE_MIN_M = 5;

/* Kleine koerswijzigingen worden niet direct doorgegeven. */
const BEARING_MARKER_DEADBAND_LOW_DEG = 5;
const BEARING_MARKER_DEADBAND_HIGH_DEG = 2;

const BEARING_CAMERA_DEADBAND_LOW_DEG = 7;
const BEARING_CAMERA_DEADBAND_HIGH_DEG = 3;

/* Tijdconstanten: hoger = rustiger/langzamer. */
const BEARING_MARKER_TAU_WALK_S = 1.15;
const BEARING_MARKER_TAU_MID_S = 0.65;
const BEARING_MARKER_TAU_FAST_S = 0.38;

const BEARING_CAMERA_TAU_WALK_S = 2.4;
const BEARING_CAMERA_TAU_MID_S = 1.25;
const BEARING_CAMERA_TAU_FAST_S = 0.72;
   
const MOTION_HARD_SNAP_MIN_M = 40;
const MOTION_HARD_SNAP_MAX_M = 120;
/* ── stale GPS / dead reckoning ─────────────────────────────
   Vrij rijden is conservatiever dan actieve navigatie.
   Tijd én afstand worden begrensd, zodat een oude snelheid niet
   tientallen of honderden meters fictief blijft doorlopen. */

const GPS_STALE_AFTER_MS = 3200;

/* Vrij rijden */
const DR_FREE_HOLD_S = 2.5;
const DR_FREE_DECAY_S = 3.5;
const DR_FREE_MAX_AGE_S = 8;
const DR_FREE_MAX_DIST_M = 28;

/* Actieve route */
const DR_ROUTE_HOLD_S = 4.5;
const DR_ROUTE_DECAY_S = 6;
const DR_ROUTE_MAX_AGE_S = 14;
const DR_ROUTE_MAX_DIST_M = 120;

/* Na zeer lange fixuitval stopt visuele voorspelling volledig. */
const DR_ABSOLUTE_MAX_AGE_S = 18;

const motion = {
  pos:null,
  bearing:null,

  anchor:null,
  anchorBearing:null,
  anchorPerf:0,

  speed:0,
  acc:999,

  routeAlong:null,
  routeMode:false,

  /* Laatste echte GPS-gebaseerde motion update. */
  lastFixPerf:0,

  /* Bewaakt één stale episode. */
  staleActive:false,
  staleStartPerf:0,

  raf:0,
  lastDraw:0
};

/* Visuele stilstandstoestand.
   lockPos is uitsluitend een renderpositie; raw GPS blijft onaangetast. */
const stationary = {
  active:false,
  candidateSince:0,
  lockPos:null,
  lockBearing:null,
  exitEvidence:0
};

/* Marker- en camerakoers worden apart gefilterd.
   measured is de laatst geaccepteerde koersmeting.
   marker is de visuele richting van de driehoek.
   camera is de rustigere richting van de 3D-kaart. */
const bearingState = {
  measured:null,
  marker:null,
  camera:null,
  lastMarkerPerf:0,
  lastCameraPerf:0
};

function stationaryRadiusLimit(acc){
  const a = Number.isFinite(acc) ? acc : 999;

  return Math.max(
    STATIONARY_RADIUS_MIN_M,
    Math.min(
      STATIONARY_RADIUS_MAX_M,
      a * 0.85
    )
  );
}

function stationaryExitDistance(acc){
  const a = Number.isFinite(acc) ? acc : 999;

  return Math.max(
    STATIONARY_EXIT_DIST_MIN_M,
    Math.min(
      STATIONARY_EXIT_DIST_MAX_M,
      a * 1.4
    )
  );
}

/* Bepaal een robuust middelpunt van recente fixes.
   We gebruiken het gemiddelde van lat/lon; uitschieters beïnvloeden
   de radiuscontrole vervolgens vanzelf negatief en verhinderen dan
   een te snelle stationary lock. */
function recentFixCluster(ts){
  const fixes = fixBuf.filter(f => ts - f.t <= STATIONARY_WINDOW_MS);

  if (fixes.length < 3) return null;

  const spanMs = fixes[fixes.length - 1].t - fixes[0].t;
  if (spanMs < STATIONARY_MIN_SPAN_MS) return null;

  let lat = 0;
  let lon = 0;

  for (const f of fixes){
    lat += f.lat;
    lon += f.lon;
  }

  const center = {
    lat:lat / fixes.length,
    lon:lon / fixes.length
  };

  let maxRadius = 0;

  for (const f of fixes){
    maxRadius = Math.max(maxRadius, hv(center, f));
  }

  return {
    center,
    maxRadius,
    spanMs,
    count:fixes.length
  };
}

function clearStationaryCandidate(){
  stationary.candidateSince = 0;
}

/* Wordt per GPS-fix aangeroepen.
   rawSpeed is de actuele GPS-/afgeleide snelheid vóór visuele filtering. */
function updateStationaryState(ts, rawSpeed, acc){
  const here = {
    lat:lastLat,
    lon:lastLon
  };

  if (here.lat == null || here.lon == null) return;

  /* ── reeds vergrendeld: alleen loslaten bij overtuigende beweging ── */
  if (stationary.active){
    const distFromLock = stationary.lockPos
      ? hv(stationary.lockPos, here)
      : 0;

    const fastEnough =
      rawSpeed != null &&
      Number.isFinite(rawSpeed) &&
      rawSpeed >= STATIONARY_EXIT_SPEED_MS;

    const farEnough =
      distFromLock >= stationaryExitDistance(acc);

    if (fastEnough || farEnough){
      stationary.exitEvidence++;
    } else {
      stationary.exitEvidence = 0;
    }

        if (stationary.exitEvidence >= STATIONARY_EXIT_CONFIRM_FIXES){
      stationary.active = false;
      stationary.candidateSince = 0;
      stationary.lockPos = null;
      stationary.lockBearing = null;
      stationary.exitEvidence = 0;

      /* Na echte stilstand moeten marker en camera niet eerst vanaf
         een mogelijk oude koers minutenlang terugfilteren. De eerstvolgende
         betrouwbare bewegingskoers mag een nieuwe basis vormen. */
      bearingState.measured = null;
      bearingState.marker = null;
      bearingState.camera = null;
      bearingState.lastMarkerPerf = 0;
      bearingState.lastCameraPerf = 0;
    }

    return;
  }

  /* ── nog bewegend: onderzoeken of fixes een compacte cluster vormen ── */
  const cluster = recentFixCluster(ts);

  const slowEnough =
    rawSpeed == null ||
    !Number.isFinite(rawSpeed) ||
    rawSpeed <= STATIONARY_SPEED_MAX_MS;

  const compactEnough =
    cluster &&
    cluster.maxRadius <= stationaryRadiusLimit(acc);

  if (!slowEnough || !compactEnough){
    clearStationaryCandidate();
    return;
  }

  if (!stationary.candidateSince){
    stationary.candidateSince = Date.now();
    return;
  }

  if (
    Date.now() - stationary.candidateSince <
    STATIONARY_ENTER_CONFIRM_MS
  ){
    return;
  }

  /* Overtuigende stilstand: vergrendel de visuele positie op het
     middelpunt van de recente GPS-cluster, niet op één willekeurige fix. */
  stationary.active = true;
  stationary.lockPos = {
    lat:cluster.center.lat,
    lon:cluster.center.lon
  };
  stationary.lockBearing =
    motion.bearing ??
    lastBearing ??
    null;

  stationary.exitEvidence = 0;
}

/* Camera-control staat los van de marker-smoothing.
   Daardoor kan de driehoek blijven bewegen terwijl MapLibre
   tijdelijk volledige controle krijgt over pinch, drag of zoom. */
const cameraControl = {
  interactionActive:false,
  buttonZoomUntil:0,
  lastDraw:0,
  gestureEndTimer:0,
  buttonZoomTimer:0,
  /* Patch 11: actieve pointers op het kaartcanvas. Zolang deze set
     niet leeg is, mag de camerablokkade niet worden opgeheven. */
  pointers:new Set(),
  lastTouchBlockLog:0
};
   
function beginCameraInteraction(){
  clearTimeout(cameraControl.gestureEndTimer);
  cameraControl.interactionActive = true;
}

function endCameraInteraction(){
  /* Patch 11: zolang er nog ten minste één vinger op het kaartcanvas
     staat, blijft de blokkade staan. Dit dekt zowel een pinch waarbij
     één vinger eerder loslaat, als dragend/zoomend-events die vóór de
     laatste pointerup binnenkomen. De release volgt dan vanzelf via
     de laatste pointerup/pointercancel op window. */
  if (cameraControl.pointers.size > 0) return;

  clearTimeout(cameraControl.gestureEndTimer);

  /* Korte grace period voorkomt dat de follow-camera al in hetzelfde
     touch-einde terugschrijft terwijl MapLibre de gesture afrondt. */
   cameraControl.gestureEndTimer = setTimeout(() => {
    cameraControl.interactionActive = false;
    cameraControl.lastDraw = 0;
    ensureMotionLoop();
  }, CAMERA_GESTURE_GRACE_MS);
}

function blockCameraForButtonZoom(){
  clearTimeout(cameraControl.buttonZoomTimer);

  cameraControl.buttonZoomUntil =
    performance.now() + CAMERA_BUTTON_ZOOM_BLOCK_MS;

  cameraControl.buttonZoomTimer = setTimeout(() => {
    cameraControl.buttonZoomUntil = 0;
    cameraControl.lastDraw = 0;
    ensureMotionLoop();
  }, CAMERA_BUTTON_ZOOM_BLOCK_MS + 20);
}

function cameraWriteBlocked(now){
  if (!map || !mapReady) return true;
  if (cameraControl.interactionActive) return true;
  if (now < cameraControl.buttonZoomUntil) return true;

  /* Extra vangnet: ook programmatic MapLibre-animaties mogen niet
     door onze follow-camera met jumpTo() worden afgebroken. */
  if (typeof map.isEasing === "function" && map.isEasing()) return true;
  if (typeof map.isZooming === "function" && map.isZooming()) return true;

  return false;
}

function drawFollowCamera(now){
  if (!mapReady || !map || !following || !motion.pos) return;
  if (cameraWriteBlocked(now)) return;

  if (
    cameraControl.lastDraw &&
    now - cameraControl.lastDraw < CAMERA_FRAME_MS
  ){
    return;
  }

  const prevDraw = cameraControl.lastDraw;
  cameraControl.lastDraw = now;

  /* Noord-vast (alleen 2D): bearing hard op 0. De smoothing-state
     wordt meegezet zodat het loslaten van de lock later zonder
     sprong vanaf 0° verder filtert. Gaat bewust vóór stationary. */
  if (northLocked()){
    bearingState.camera = 0;
    bearingState.lastCameraPerf = now;
    map.jumpTo({
      center:[motion.pos.lon, motion.pos.lat],
      bearing:0
    });
    return;
  }

  /* Camerakoers is bewust rustiger dan markerkoers.
     De driehoek mag dus een bocht eerder tonen terwijl de horizon
     pas volgt wanneer de koerswijziging stabiel genoeg is. */
  const cameraTargetBearing = stationary.active
    ? stationary.lockBearing
    : (
        bearingState.marker ??
        bearingState.measured ??
        motion.bearing ??
        lastBearing
      );

  let cameraBearing = map.getBearing();

  if (cameraTargetBearing != null){
    if (bearingState.camera == null){
      bearingState.camera = normBearing(cameraTargetBearing);
      bearingState.lastCameraPerf = now;
    } else {
      const dtS = bearingState.lastCameraPerf
        ? Math.min(
            0.35,
            Math.max(
              0,
              (now - bearingState.lastCameraPerf) / 1000
            )
          )
        : (
            prevDraw
              ? Math.min(0.35, Math.max(0, (now - prevDraw) / 1000))
              : 0
          );

      bearingState.lastCameraPerf = now;

      const delta = Math.abs(
        shortestBearingDelta(
          bearingState.camera,
          cameraTargetBearing
        )
      );

      if (
        stationary.active ||
        delta >= cameraBearingDeadband(dispSpeed)
      ){
        const alpha = stationary.active
          ? 1
          : expAlpha(
              dtS,
              cameraBearingTau(dispSpeed)
            );

        bearingState.camera = bearingLerp(
          bearingState.camera,
          cameraTargetBearing,
          alpha
        );
      }
    }

    cameraBearing = bearingState.camera;
  }

  map.jumpTo({
    center:[
      motion.pos.lon,
      motion.pos.lat
    ],
    bearing:cameraBearing
  });
}

const normBearing = deg => ((deg % 360) + 360) % 360;

function shortestBearingDelta(fromDeg, toDeg){
  if (fromDeg == null || toDeg == null) return 0;

  return (
    (toDeg - fromDeg + 540) % 360
  ) - 180;
}

function bearingLerp(fromDeg, toDeg, alpha){
  if (fromDeg == null) return normBearing(toDeg);
  if (toDeg == null) return normBearing(fromDeg);

  const d = shortestBearingDelta(fromDeg, toDeg);

  return normBearing(
    fromDeg + d * Math.max(0, Math.min(1, alpha))
  );
}

function expAlpha(dtS, tauS){
  if (!Number.isFinite(dtS) || dtS <= 0) return 1;
  if (!Number.isFinite(tauS) || tauS <= 0) return 1;

  return 1 - Math.exp(-dtS / tauS);
}

function markerBearingTau(speed){
  const v = Math.max(0, speed || 0);

  if (v < 3){
    return BEARING_MARKER_TAU_WALK_S;
  }

  if (v < 8){
    return BEARING_MARKER_TAU_MID_S;
  }

  return BEARING_MARKER_TAU_FAST_S;
}

function cameraBearingTau(speed){
  const v = Math.max(0, speed || 0);

  if (v < 3){
    return BEARING_CAMERA_TAU_WALK_S;
  }

  if (v < 8){
    return BEARING_CAMERA_TAU_MID_S;
  }

  return BEARING_CAMERA_TAU_FAST_S;
}

function markerBearingDeadband(speed){
  return (speed || 0) < 3
    ? BEARING_MARKER_DEADBAND_LOW_DEG
    : BEARING_MARKER_DEADBAND_HIGH_DEG;
}

function cameraBearingDeadband(speed){
  return (speed || 0) < 3
    ? BEARING_CAMERA_DEADBAND_LOW_DEG
    : BEARING_CAMERA_DEADBAND_HIGH_DEG;
}

/* Kies voor GPS-afgeleide koers een referentiefix op voldoende afstand.
   Bij wandelen is afstand belangrijker dan alleen tijd: enkele seconden
   kunnen anders slechts 2–4 meter basis geven, wat veel hoekruis oplevert. */
function derivedBearingFromFixes(ts, lat, lon, acc, speed){
  if (!fixBuf || fixBuf.length < 2) return null;

  const here = {lat, lon};
  const v = Math.max(0, speed || 0);

  /* Bij wandelen streven we naar ongeveer 9–22 m meetbasis.
     Bij hogere snelheid mag de basis korter zijn voor responsie. */
  let minBaseM;

  if (v < 3){
    minBaseM = Math.max(
      BEARING_WALK_BASE_MIN_M,
      Math.min(
        BEARING_WALK_BASE_MAX_M,
        Math.max(0, Number.isFinite(acc) ? acc : 0) * 1.15
      )
    );
  } else {
    minBaseM = BEARING_VEHICLE_BASE_MIN_M;
  }

  let best = null;

  /* Zoek van nieuw naar oud de eerste fix die voldoende ruimtelijke
     basis geeft. Zo blijft de koers relatief actueel. */
  for (let i = fixBuf.length - 2; i >= 0; i--){
    const f = fixBuf[i];

    if (ts - f.t < 1200){
      continue;
    }

    const moved = hv(f, here);

    if (moved >= minBaseM){
      best = f;
      break;
    }
  }

  if (!best){
    return null;
  }

  return routeBearing(best, here);
}
   
function angleDelta(from, to){ return ((to - from + 540) % 360) - 180; }
function routeBearing(a, b){
  const lat1 = a.lat*Math.PI/180, lat2 = b.lat*Math.PI/180;
  const dLon = (b.lon-a.lon)*Math.PI/180;
  const y = Math.sin(dLon)*Math.cos(lat2);
  const x = Math.cos(lat1)*Math.sin(lat2) - Math.sin(lat1)*Math.cos(lat2)*Math.cos(dLon);
  return normBearing(Math.atan2(y,x)*180/Math.PI);
}
function moveGeo(p, bearing, distM){
  if (!(distM > 0) || bearing == null) return { lat:p.lat, lon:p.lon };
  const br = bearing*Math.PI/180, d = distM/R;
  const lat1 = p.lat*Math.PI/180, lon1 = p.lon*Math.PI/180;
  const lat2 = Math.asin(Math.sin(lat1)*Math.cos(d) + Math.cos(lat1)*Math.sin(d)*Math.cos(br));
  const lon2 = lon1 + Math.atan2(Math.sin(br)*Math.sin(d)*Math.cos(lat1),
                                Math.cos(d)-Math.sin(lat1)*Math.sin(lat2));
  return { lat:lat2*180/Math.PI, lon:((lon2*180/Math.PI+540)%360)-180 };
}
function deadReckoningLimits(routeMode){
  return routeMode
    ? {
        holdS:DR_ROUTE_HOLD_S,
        decayS:DR_ROUTE_DECAY_S,
        maxAgeS:DR_ROUTE_MAX_AGE_S,
        maxDistM:DR_ROUTE_MAX_DIST_M
      }
    : {
        holdS:DR_FREE_HOLD_S,
        decayS:DR_FREE_DECAY_S,
        maxAgeS:DR_FREE_MAX_AGE_S,
        maxDistM:DR_FREE_MAX_DIST_M
      };
}

function staleSpeed(ageS, baseSpeed, routeMode = motion.routeMode){
  const speed = Math.max(0, baseSpeed || 0);
  const limits = deadReckoningLimits(routeMode);

  if (ageS <= 0){
    return speed;
  }

  if (
    ageS >= limits.maxAgeS ||
    ageS >= DR_ABSOLUTE_MAX_AGE_S
  ){
    return 0;
  }

  if (ageS <= limits.holdS){
    return speed;
  }

  const decayAge = ageS - limits.holdS;

  return speed * Math.exp(
    -decayAge / limits.decayS
  );
}

function deadReckoningTravel(ageS, baseSpeed, routeMode = motion.routeMode){
  const speed = Math.max(0, baseSpeed || 0);
  const limits = deadReckoningLimits(routeMode);

  const cappedAgeS = Math.max(
    0,
    Math.min(
      ageS,
      limits.maxAgeS,
      DR_ABSOLUTE_MAX_AGE_S
    )
  );

  let distM;

  if (cappedAgeS <= limits.holdS){
    distM = speed * cappedAgeS;
  } else {
    const decayAge = cappedAgeS - limits.holdS;

    distM =
      speed * limits.holdS +
      speed * limits.decayS *
        (1 - Math.exp(-decayAge / limits.decayS));
  }

  return Math.min(
    limits.maxDistM,
    Math.max(0, distM)
  );
}

function beginStaleEpisode(now){
  if (motion.staleActive) return;

  motion.staleActive = true;
  motion.staleStartPerf = motion.lastFixPerf
    ? Math.min(
        now,
        motion.lastFixPerf + GPS_STALE_AFTER_MS
      )
    : now;
}

function clearStaleEpisode(){
  motion.staleActive = false;
  motion.staleStartPerf = 0;
}

function invalidateRouteDeadReckoning(){
  const wasRouteMode = motion.routeMode;

  motion.routeMode = false;
  motion.routeAlong = null;

  if (
    !wasRouteMode ||
    !motion.staleActive ||
    !motion.pos
  ){
    return;
  }

  /* Een routewissel of nav-stop tijdens stale GPS mag de marker
     niet terugtrekken naar een oude vrije anchor. Bevries daarom
     op de actuele visuele positie tot een nieuwe echte GPS-fix komt. */
  motion.anchor = {
    lat:motion.pos.lat,
    lon:motion.pos.lon
  };
  motion.anchorBearing = motion.bearing;
  motion.anchorPerf = performance.now();
  motion.speed = 0;
}
   
function blendGeo(cur, target, a){
  const dLon = ((target.lon-cur.lon+540)%360)-180;
  cur.lat += (target.lat-cur.lat)*a;
  cur.lon = ((cur.lon + dLon*a + 540)%360)-180;
}
function predictMotion(now){
  if (!motion.anchor){
    return null;
  }

  const ageS = Math.max(
    0,
    (now - motion.anchorPerf) / 1000
  );

  /* Na enkele seconden zonder echte fix begint een stale episode.
     De starttijd wordt teruggelegd op het echte stale-moment, zodat
     achtergrond/big-mode geen nieuwe volledige extrapolatieperiode krijgt. */
  if (
    motion.lastFixPerf &&
    now - motion.lastFixPerf >= GPS_STALE_AFTER_MS
  ){
    beginStaleEpisode(now);
  }

  const staleAgeS = motion.staleActive
    ? Math.max(
        0,
        (now - motion.staleStartPerf) / 1000
      )
    : 0;

  const routeMode =
    motion.routeMode &&
    motion.routeAlong != null &&
    nav.coords &&
    nav.coords.length > 1;

  const baseSpeed = Math.max(
    0,
    motion.speed || 0
  );

  const liveSpeed = motion.staleActive
    ? staleSpeed(
        staleAgeS,
        baseSpeed,
        routeMode
      )
    : baseSpeed;

  /* Afstand wordt geïntegreerd, niet berekend als actuele snelheid × totale tijd.
     Daardoor kan de voorspelde positie tijdens speed-decay nooit teruglopen. */
  const travelM = motion.staleActive
    ? (
        baseSpeed * Math.min(
          ageS,
          GPS_STALE_AFTER_MS / 1000
        ) +
        deadReckoningTravel(
          staleAgeS,
          baseSpeed,
          routeMode
        )
      )
    : baseSpeed * ageS;

  let predicted;

  /* ── route-aware extrapolatie ─────────────────────────── */
  if (routeMode){
    const along = Math.max(
      0,
      motion.routeAlong + travelM
    );

    const rp = pointAtRouteAlong(along);

    if (rp){
      predicted = {
        lat:rp.lat,
        lon:rp.lon,
        bearing:
          rp.bearing ??
          motion.anchorBearing ??
          motion.bearing,
        ageS,
        liveSpeed,
        routeAlong:rp.along
      };
    }
  }

  /* ── vrije extrapolatie ───────────────────────────────── */
  if (!predicted){
    const p = moveGeo(
      motion.anchor,
      motion.anchorBearing ?? motion.bearing,
      travelM
    );

    predicted = {
      lat:p.lat,
      lon:p.lon,
      bearing:
        motion.anchorBearing ??
        motion.bearing,
      ageS,
      liveSpeed,
      routeAlong:null
    };
  }

  return predicted;
}
   
function setMotionTarget(target, acc, speed){
  const now = performance.now();
     /* Elke call naar setMotionTarget komt uit een nieuwe GPS-fix.
     Daarmee eindigt een eventuele stale/dead-reckoning episode. */
  clearStaleEpisode();
  motion.lastFixPerf = now;
  const mapVisible = document.visibilityState === "visible" && state.presentation === "map";
    /* Kies één consistente koersbron voor de motion predictor.
     Tijdens stationary wint de vergrendelde koers.
     Tijdens beweging prefereren we de nieuwe gefilterde koersmeting;
     alleen als die ontbreekt vallen we terug op de targetbearing. */
  const targetBearing = stationary.active
    ? stationary.lockBearing
    : (
        bearingState.measured ??
        target.bearing ??
        lastBearing ??
        motion.bearing
      );

  if (!motion.pos || !mapVisible){
    /* Als de kaart verborgen is (groot getal / achtergrond), bestaat er geen
       visuele overgang om te behouden. Houd de interne positie dan actueel. */
    motion.pos = {
      lat:target.lat,
      lon:target.lon
    };

    if (targetBearing != null){
      motion.bearing = normBearing(targetBearing);
    }

  } else {
    const err = hv(motion.pos, target);

    const hard = Math.max(
      MOTION_HARD_SNAP_MIN_M,
      Math.min(
        MOTION_HARD_SNAP_MAX_M,
        3 * Math.max(1, acc || 999)
      )
    );

    if (err > hard){
      motion.pos = {
        lat:target.lat,
        lon:target.lon
      };

      if (targetBearing != null){
        motion.bearing = normBearing(targetBearing);
      }
    }
  }

  motion.anchor = {
    lat:target.lat,
    lon:target.lon
  };

  motion.anchorBearing = targetBearing == null
    ? motion.bearing
    : normBearing(targetBearing);

  motion.anchorPerf = now;

  /* Tijdens stationary lock is visuele extrapolatie expliciet nul.
     De ruwe snelheid elders in de app blijft onaangetast. */
  motion.speed = stationary.active
    ? 0
    : Math.max(0, speed || 0);

  motion.acc = acc || 999;

  motion.routeAlong = stationary.active
    ? null
    : (target.routeAlong == null ? null : target.routeAlong);

  motion.routeMode =
    !stationary.active &&
    target.routeAlong != null;

  ensureMotionLoop();
}
   
function drawMotionFrame(now){
  motion.raf = 0;
  if (document.visibilityState !== "visible" || state.presentation !== "map" || !marker) return;
  if (motion.lastDraw && now-motion.lastDraw < MOTION_FRAME_MS){
    motion.raf = requestAnimationFrame(drawMotionFrame);
    return;
  }
  const dt = motion.lastDraw ? Math.min(.12, (now-motion.lastDraw)/1000) : 1/MOTION_FPS;
  motion.lastDraw = now;
  const desired = predictMotion(now);
  if (!desired || !motion.pos) return;

  /* Exponentiële foutcorrectie: nauwkeurige fixes trekken sneller bij dan grove fixes. */
  const tau = motion.acc <= 8 ? .34 : motion.acc <= 20 ? .52 : .75;
  const aPos = 1-Math.exp(-dt/tau);
  blendGeo(motion.pos, desired, aPos);

  if (desired.bearing != null){
    if (motion.bearing == null) motion.bearing = normBearing(desired.bearing);
    const aBear = 1-Math.exp(-dt/.38);
    motion.bearing = normBearing(motion.bearing + angleDelta(motion.bearing, desired.bearing)*aBear);
  }

  /* Markerpositie blijft op de volledige motion-frequentie bewegen. */
  marker.setLngLat([
    motion.pos.lon,
    motion.pos.lat
  ]);

  /* Markerkoers krijgt een eigen snelheidsafhankelijk filter.
     Tijdens stationary lock blijft de eerder vastgezette koers staan. */
  const markerTargetBearing = stationary.active
    ? stationary.lockBearing
    : motion.staleActive
      ? (
          motion.bearing ??
          bearingState.measured ??
          lastBearing
        )
      : (
          bearingState.measured ??
          motion.bearing ??
          lastBearing
        );

  if (markerTargetBearing != null){
    if (bearingState.marker == null){
      bearingState.marker = normBearing(markerTargetBearing);
      bearingState.lastMarkerPerf = now;
    } else {
      const dtS = bearingState.lastMarkerPerf
        ? Math.min(0.25, Math.max(0, (now - bearingState.lastMarkerPerf) / 1000))
        : 0;

      bearingState.lastMarkerPerf = now;

      const delta = Math.abs(
        shortestBearingDelta(
          bearingState.marker,
          markerTargetBearing
        )
      );

      if (
        stationary.active ||
        delta >= markerBearingDeadband(dispSpeed)
      ){
        const alpha = stationary.active
          ? 1
          : expAlpha(
              dtS,
              markerBearingTau(dispSpeed)
            );

        bearingState.marker = bearingLerp(
          bearingState.marker,
          markerTargetBearing,
          alpha
        );
      }
    }

    marker.setRotation(bearingState.marker);
  } else {
    marker.setRotation(0);
  }

  /* Camera volgt apart, rustiger en minder vaak. */
  drawFollowCamera(now);

  const err = hv(motion.pos, desired);
  const bErr = desired.bearing == null || motion.bearing == null ? 0
    : Math.abs(angleDelta(motion.bearing, desired.bearing));
  const liveSpeed = Math.max(0, desired.liveSpeed || 0);
  if (liveSpeed > .15 || err > .12 || bErr > .25 || desired.ageS < 1.2)
    motion.raf = requestAnimationFrame(drawMotionFrame);
}
   
function ensureMotionLoop(){
  if (motion.raf || !motion.anchor || !marker) return;
  if (document.visibilityState !== "visible" || state.presentation !== "map") return;
  motion.lastDraw = 0;
  motion.raf = requestAnimationFrame(drawMotionFrame);
}

/* ═══ PATCH 23 — STARTZOOM PER WEERGAVE ════════════════
   Twee tabellen, want 2D en 3D horen bij verschillende voertuigen:
   2D in de auto (portrait), 3D op de fiets en de brommer. In 3D kijk
   je door de kanteling veel verder vooruit, dus daar mag hetzelfde
   zoomgetal krapper staan.

   Elke tabel heeft éigen drempels. Dat is de kern: een brommer van
   45 km/u hoort in 3D nog bij "stad" (dus 17), terwijl 45 km/u in de
   2D-tabel al buitenweg is. Zo krijgt fiets/brommer 17 en de auto in
   3D 14, zonder dat de app hoeft te weten wat voor voertuig het is.
   Tunable: alles hieronder. */
const START_ZOOM = {
  "2d": {                                   /* auto, portrait */
    niveaus: { stil:17, stad:16, buitenweg:15.5, snelweg:9 },
    grenzen: { stad:10, buitenweg:25, snelweg:85 },
    onbekend:16
  },
  "3d": {                                   /* fiets / brommer, auto bij snelheid */
    niveaus: { stil:17, stad:17, buitenweg:17, snelweg:14 },
    grenzen: { stad:10, buitenweg:25, snelweg:50 },
    onbekend:16
  }
};
const START_ZOOM_SETTLE_MS = 10000;

function zoomTabel(mode){ return START_ZOOM[mode === "3d" ? "3d" : "2d"]; }

function zoomForSpeed(kmh, mode){
  const t = zoomTabel(mode), n = t.niveaus, g = t.grenzen;
  if (!Number.isFinite(kmh) || kmh < g.stad) return n.stil;
  if (kmh < g.buitenweg) return n.stad;
  if (kmh < g.snelweg)   return n.buitenweg;
  return n.snelweg;
}

function initMap(lon, lat, speedMs){
  /* Patch 20: lastLat/lastLon staan al → de zonberekening klopt.
     Hebben we de gewenste stijl al in cache, dan start de kaart er
     direct in (geen witte flits bij een avondstart). Zo niet, dan
     starten we in de bewezen dagstijl en wisselt applyMapTheme()
     zodra de stijl binnen is — nooit een blanco kaart door een koude
     start zonder netwerk. */
  applyTheme();
  const bootStyle = themedStyle(themeNow);

  /* Patch 22: snelheid van de eerste fix → startzoom. */
  const startKmh = (speedMs != null && !isNaN(speedMs) && speedMs >= 0)
    ? speedMs * 3.6 : NaN;
  /* viewMode staat al vast (uit localStorage), dus de kaart start
     meteen op het niveau dat bij deze weergave hoort. */
  const startZoom = Number.isFinite(startKmh)
    ? zoomForSpeed(startKmh, viewMode) : zoomTabel(viewMode).onbekend;
  diagAdd("zoom.start", {
    kmh: Number.isFinite(startKmh) ? +startKmh.toFixed(1) : null,
    view:viewMode, zoom:startZoom });

  map = new maplibregl.Map({
    container:"map", style: bootStyle || STYLE_DAY,
    center:[lon,lat], zoom:startZoom, pitch:viewMode === "3d" ? 60 : 0, bearing:0,
    attributionControl:{compact:true}, fadeDuration:0
  });
  mapStyleApplied = bootStyle ? themeNow : "day";

  /* Gaf de eerste fix geen snelheid (koude start, sommige toestellen),
     dan één keer herzien zodra dispSpeed is ingelopen — en alleen als de
     gebruiker de kaart nog niet heeft aangeraakt. Nooit vaker dan dit:
     zoom die tijdens het rijden uit zichzelf verspringt is hinderlijk. */
  if (!Number.isFinite(startKmh)){
    /* dispSpeed is een EMA en loopt vanaf 0 in; op t+6 s stond hij bij
       119 km/u nog pas rond 45. Daarom 10 s én de PIEK over dat venster,
       niet de momentwaarde — anders kies je een te krappe zoom. */
    let peakKmh = 0;
    const sampler = setInterval(() => {
      peakKmh = Math.max(peakKmh, dispSpeed * 3.6);
    }, 500);
    setTimeout(() => {
      clearInterval(sampler);
      if (!map || !mapReady || !following) return;
      if (cameraControl.interactionActive) return;
     const kmh = Math.max(peakKmh, dispSpeed * 3.6);
      /* viewMode hier opnieuw lezen: heb je in die 10 s van 2D naar 3D
         gewisseld, dan telt de weergave waarin je nu staat. */
      const want = zoomForSpeed(kmh, viewMode);
      if (Math.abs(map.getZoom() - want) < .1) return;
      blockCameraForButtonZoom();
      map.easeTo({ zoom:want, duration:300 });
      diagAdd("zoom.start_settled", {
        kmh:+kmh.toFixed(1), view:viewMode, zoom:want });
    }, START_ZOOM_SETTLE_MS);
  }
  map.touchZoomRotate.disableRotation();

  /* ── Patch 11: vroege camerablokkade ─────────────────────────
     dragstart/zoomstart vuren pas nádat MapLibre de gesture herkend
     heeft; in dat herkenningsvenster overschreef de follow-camera
     elke ~67 ms de opgebouwde pan-delta (jumpTo), waardoor een veeg
     of pinch niet "pakte". Daarom blokkeren we camera-writes al bij
     het eerste rauwe touchcontact op het canvas — dezelfde
     blauwdruk als blockCameraForButtonZoom(): blokkade vóór de
     camera-actie in plaats van erna.
     Bewust GEEN suspendFollow() hier: het 10 s pauzeren van follow
     blijft exclusief aan een echte drag gekoppeld (dragstart-pad).
     Listeners staan op het canvas zelf; fabs en panelen boven de
     kaart raken dit pad nooit. Passief: geen preventDefault nodig. */
  const canvas = map.getCanvas();

  const onCanvasPointerDown = e => {
    cameraControl.pointers.add(e.pointerId);
    /* Gethrottlede diagnose: verifieerbaar op de Carluex dat het
       vroege pad actief wordt. Alleen loggen bij de overgang
       (blokkade nog niet actief) en max. 1× per 5 s. */
    if (following && !cameraControl.interactionActive){
      const now = Date.now();
      if (now - cameraControl.lastTouchBlockLog > 5000){
        cameraControl.lastTouchBlockLog = now;
        diagAdd("camera.touch_block", {
          pointers:cameraControl.pointers.size
        });
      }
    }
    beginCameraInteraction();
  };

  const onWindowPointerEnd = e => {
    /* Alleen reageren op pointers die wij zelf volgen; pointerups
       van fabs/panelen (nooit toegevoegd) worden hier genegeerd.
       Window-niveau vangt ook een vinger die buiten het canvas
       loslaat. */
    if (!cameraControl.pointers.delete(e.pointerId)) return;
    if (cameraControl.pointers.size === 0) endCameraInteraction();
  };

  if (window.PointerEvent){
    canvas.addEventListener("pointerdown", onCanvasPointerDown, { passive:true });
    window.addEventListener("pointerup", onWindowPointerEnd, { passive:true });
    window.addEventListener("pointercancel", onWindowPointerEnd, { passive:true });
  } else {
    /* Fallback voor WebViews zonder Pointer Events (Carluex-
       verzekering). Door de feature-check kan nooit dubbel worden
       afgehandeld. Touch events hebben geen pointerId; we houden de
       blokkade simpelweg aan tot álle vingers los zijn
       (e.touches.length === 0) en maken dan de set leeg — lekvrij,
       want all-fingers-up ruimt altijd volledig op. */
    canvas.addEventListener("touchstart", () => {
      cameraControl.pointers.add("touch");
      beginCameraInteraction();
    }, { passive:true });
    const onWindowTouchEnd = e => {
      if (e.touches && e.touches.length) return;
      cameraControl.pointers.clear();
      endCameraInteraction();
    };
    window.addEventListener("touchend", onWindowTouchEnd, { passive:true });
    window.addEventListener("touchcancel", onWindowTouchEnd, { passive:true });
  }

  map.setPadding({ top: Math.round(innerHeight * .58) });
   
  const el = document.createElement("div");
  el.className = "me";
  el.innerHTML = `<svg viewBox="0 0 30 30"><path d="M15 3 L25 27 L15 21 L5 27 Z" fill="#FFB300" stroke="#0B0F14" stroke-width="1.5"/></svg>`;
    marker = new maplibregl.Marker({element:el, rotationAlignment:"map"})
            .setLngLat([lon,lat]).addTo(map);

  map.on("load", () => {
    mapReady = true;
    applyMapPadding();
    if (nav.coords.length) drawNavRoute();
    applyTheme();          /* Patch 20: correctie als het thema intussen wisselde */
  });

  /* Slepen betekent bewust: gebruiker wil de kaart bekijken.
     Daarom pauzeren we follow zoals voorheen gedurende 10 s. */
  map.on("dragstart", e => {
    if (!e.originalEvent) return;
    beginCameraInteraction();
    suspendFollow();
  });

  map.on("dragend", e => {
    if (!e.originalEvent) return;
    endCameraInteraction();
  });

  /* Pinch-zoom krijgt tijdelijk volledige cameracontrole,
     maar schakelt position-follow niet 10 seconden uit.
     Na afloop hervat de bestaande motion-loop automatisch. */
  map.on("zoomstart", e => {
    if (!e.originalEvent) return;
    beginCameraInteraction();
  });

  map.on("zoomend", e => {
    if (!e.originalEvent) return;
    endCameraInteraction();
  });

   /* Patch 9: zoomlevel-indicator bijwerken bij elke zoomwijziging,
     ongeacht de bron (knoppen, pinch, dubbeltik). */
  map.on("zoom", showZoomLevel);
}
function updateCamera(lon, lat, bearing, acc=999, routeProj=null){
  const snapped = routeProj && routeProj.d <= routeSnapLimit(acc);
  setMotionTarget({
    lat: snapped ? routeProj.lat : lat,
    lon: snapped ? routeProj.lon : lon,
    bearing: snapped ? routeProj.bearing : bearing,
    routeAlong: snapped ? routeProj.along : null
  }, acc, dispSpeed);
}
function suspendFollow(){
  following = false;
  clearTimeout(followTimer);
  followTimer = setTimeout(resumeFollow, 10000);
  render();
}
function resumeFollow(){
  clearTimeout(followTimer);

  /* Een expliciete recenter-actie van de gebruiker beëindigt
     eventuele oude gesture-/zoomblokkades. */
  clearTimeout(cameraControl.gestureEndTimer);
  clearTimeout(cameraControl.buttonZoomTimer);
  cameraControl.interactionActive = false;
  cameraControl.buttonZoomUntil = 0;
  cameraControl.lastDraw = 0;

  following = true;

  if (marker && mapReady && state.presentation === "map"){
    const p = motion.pos || (() => {
      const q = marker.getLngLat();
      return {lat:q.lat, lon:q.lng};
    })();

       const resumeBearing = northLocked() ? 0 :
      (bearingState.camera ??
      bearingState.marker ??
      motion.bearing ??
      lastBearing ??
      map.getBearing());

    map.jumpTo({
      center:[p.lon,p.lat],
      bearing:resumeBearing
    });
  }

  ensureMotionLoop();
  render();
}

/* ── GPS & snelheidsfilter (hergebruikt) ─────────────────── */
/* ── GPS-watchdog (Patch 8c) ────────────────────────────────
   Doel: een gestorven geolocation-watch tijdens een zeer lange
   rit (10–12 u) gecontroleerd herstarten, zonder restart-loops
   of gestapelde watches. Eén watch-ID, één herstartpad, één
   cooldown. De watchdog kijkt naar het uitblijven van ÁLLE
   callbacks (fix én error): een stroom TIMEOUT-errors betekent
   dat de watch nog leeft (slechte ontvangst) — dan niet
   herstarten. Tijdelijk slechte accuracy raakt de watchdog
   evenmin: accuracy-afhandeling blijft volledig bij de
   bestaande tripfilters/Patch 6. */
const gpsWd = {
  watchId: null,     // actieve watchPosition-ID (null = geen watch)
  lastCallback: 0,   // laatste levensteken: onFix óf onErr
  lastRestart: 0,    // voor cooldown
  restarts: 0,
  errStreak: 0,      // opeenvolgende errors (code 2/3) zonder fix
  awaitingFix: false,// true tussen herstart en eerstvolgende fix
  denied: false,     // permissie geweigerd: nooit auto-herstarten
  foregroundAt: 0,   // laatste terugkeer naar foreground
  lastSuppressLog: 0
};
const GPS_WD_STALE_MS   = 45000;  // geen enkele callback in 45 s ⇒ stale
const GPS_WD_COOLDOWN   = 60000;  // max. 1 auto-herstart per minuut
const GPS_WD_FG_GRACE   = 15000;  // na foreground: watch 15 s de kans geven
const GPS_WD_ERR_STREAK = 4;      // pas na 4 errors op rij herstarten

function startGPS(reason="manual"){
  if (!("geolocation" in navigator)){
    diagAdd("gps.unsupported");
    showNotice(t("ntc_nogps"), t("ntc_nogps_t"));
    return;
  }

  /* Altijd eerst de oude watch opruimen: dit maakt startGPS()
     idempotent en sluit gestapelde watches uit. */
  if (gpsWd.watchId != null){
    try{ navigator.geolocation.clearWatch(gpsWd.watchId); } catch(e){}
    gpsWd.watchId = null;
  }

  diagAdd("gps.watch_start", {
    reason,
    restarts:gpsWd.restarts,
    enableHighAccuracy:true,
    maximumAge:1000,
    timeout:15000
  });

  gpsWd.lastCallback = Date.now(); // vers krediet voor de nieuwe watch
  gpsWd.errStreak = 0;
  gpsWd.denied = false;            // handmatige retry mag opnieuw proberen
  gpsWd.awaitingFix = reason !== "initial";

  gpsWd.watchId = navigator.geolocation.watchPosition(onFix, onErr,
    { enableHighAccuracy:true, maximumAge:1000, timeout:15000 });
}

/* Enige toegestane pad voor automatische herstarts; bewaakt de
   cooldown centraal zodat watchdog- en error-pad elkaar niet
   kunnen opjagen. */
function gpsWatchRestart(reason){
  const now = Date.now();
  if (now - gpsWd.lastRestart < GPS_WD_COOLDOWN){
    if (now - gpsWd.lastSuppressLog > GPS_WD_COOLDOWN){
      gpsWd.lastSuppressLog = now;
      diagAdd("gps.restart_suppressed", {
        reason, sinceRestartMs: now - gpsWd.lastRestart
      });
    }
    return false;
  }
  gpsWd.lastRestart = now;
  gpsWd.restarts++;
  diagAdd("gps.watch_restart", {
    reason,
    restarts:gpsWd.restarts,
    lastCallbackAgeMs: gpsWd.lastCallback ? now - gpsWd.lastCallback : null,
    lastFixAgeMs: lastFixTime ? now - lastFixTime : null,
    visibility: document.visibilityState
  });
  startGPS(reason);
  return true;
}

/* Wordt elke seconde aangeroepen vanuit de bestaande kloktimer.
   Bewust conservatief: alleen tijdens een lopende rit, alleen in
   de foreground, en alleen als de watch echt zwijgt. */
function gpsWatchdogTick(now){
  if (!trip.running) return;                              // alleen tijdens rit
  if (document.visibilityState !== "visible") return;     // background: OS mag GPS pauzeren
  if (gpsWd.watchId == null || gpsWd.denied) return;      // nooit gestart / permissie geweigerd
  if (gpsWd.foregroundAt && now - gpsWd.foregroundAt < GPS_WD_FG_GRACE) return; // net terug: geduld
  if (now - gpsWd.lastCallback <= GPS_WD_STALE_MS) return; // watch leeft nog

  diagAdd("gps.watchdog_stale", {
    lastCallbackAgeMs: now - gpsWd.lastCallback,
    lastFixAgeMs: lastFixTime ? now - lastFixTime : null
  });
  /* Binnen 2 min na foreground-terugkeer loggen we de herstart als
     foreground-gerelateerd; dat maakt iOS-suspend-patronen zichtbaar. */
  const reason = (gpsWd.foregroundAt && now - gpsWd.foregroundAt < 120000)
    ? "foreground_stale" : "stale";
  gpsWatchRestart(reason);
}
function alphaFor(acc, v){
  let a = acc <= 5 ? .60 : acc <= 10 ? .45 : acc <= 20 ? .30 : .20;
  if (v < 3) a *= .8;
  return a;
}
function onFix(pos){
  hideNotice();
  const c = pos.coords, ts = pos.timestamp;
  lastFixTime = Date.now();
  /* Patch 8c: levensteken voor de watchdog */
  gpsWd.lastCallback = lastFixTime;
  gpsWd.errStreak = 0;
  gpsWd.denied = false;
  if (gpsWd.awaitingFix){
    gpsWd.awaitingFix = false;
    diagAdd("gps.fix_after_restart", { restarts:gpsWd.restarts });
  }
  lastLat = c.latitude; lastLon = c.longitude;
  if (!firstFix){
    firstFix = true;

    stationary.active = false;
    stationary.candidateSince = 0;
    stationary.lockPos = null;
    stationary.lockBearing = null;
    stationary.exitEvidence = 0;

    initMap(c.longitude, c.latitude, c.speed);
  }

    const acc = c.accuracy ?? 999;
  $("gpsDot").className = acc <= 8 ? "ok" : acc <= 25 ? "mid" : "";
  $("gpsTxt").textContent = `±${Math.round(acc)} m`;

  diagGpsFix(c, ts, acc);

  if (c.altitude != null && !isNaN(c.altitude)){
    const va = (c.altitudeAccuracy != null && !isNaN(c.altitudeAccuracy)) ? c.altitudeAccuracy : 30;
    if (va <= 30){
      const w = va <= 8 ? .25 : va <= 15 ? .15 : .08;
      lastAltRaw = lastAltRaw == null ? c.altitude : lastAltRaw + w * (c.altitude - lastAltRaw);
    }
  }

  fixBuf.push({ t:ts, lat:c.latitude, lon:c.longitude, acc });
  while (fixBuf.length && ts - fixBuf[0].t > 12000) fixBuf.shift();

 /* ── Patch 12: plausibiliteitsfilter snelheid ──────────────
     Incidentele Doppler-glitches (multipath: viaducten, geluids-
     schermen) tilden via de EMA (alpha tot 0,60) dispSpeed en
     daarmee trip.max naar fysiek onmogelijke waarden. Drie lagen,
     bewust VÓÓR de EMA — alphaFor en de EMA zelf blijven ongemoeid:
     laag 2 (kruisvalidatie Doppler↔positie) en laag 1
     (versnellingsclamp) hier; laag 3 (bevestigingseis trip.max)
     in het tripafstand-blok. */
  let m = (c.speed != null && !isNaN(c.speed) && c.speed >= 0) ? c.speed : null;

  /* Positie-afgeleide snelheid over de bestaande ≥3 s-basislijn.
     Voorheen alleen fallback; nu altijd berekend zodat hij ook
     als kruisvalidatie naast native speed kan dienen. Alleen
     "reliable" met voldoende basis: ≥2,5 s, ≥3 bufferpunten en
     een referentiefix met acc ≤ 30 m (dekt net-gestart, na
     accuracy-bridging en dunne buffers). */
  let mPos = null, mPosReliable = false;
  if (fixBuf.length > 1){
    let ref = fixBuf[0];
    for (const f of fixBuf) if (ts - f.t >= 3000) ref = f;
    const dtBase = (ts - ref.t) / 1000;
    if (dtBase > 0.8){
      mPos = hv(ref, {lat:c.latitude, lon:c.longitude}) / dtBase;
      mPosReliable = dtBase >= 2.5 && fixBuf.length >= 3 &&
                     Number.isFinite(ref.acc) && ref.acc <= 30;
    }
  }

  if (m === null){
    m = mPos;                                  // bestaand fallbackgedrag
  } else if (mPosReliable && m > 1.3 * mPos && m - mPos > 3){
    /* Laag 2 — Doppler wantrouwen: native speed die de positie-
       afgeleide snelheid ruim overschrijdt is vrijwel zeker een
       multipath-glitch. Adoptie van mPos is per constructie altijd
       neerwaarts (voorwaarde impliceert mPos < m), dus een door
       een positieshift opgeblazen mPos kan m nooit verhógen. */
    if (Date.now() - spdF.lastDiagAt >= 10000){
      spdF.lastDiagAt = Date.now();
      diagAdd("speed.doppler_distrust", {
        native:+m.toFixed(2), positional:+mPos.toFixed(2)
      });
    }
    m = mPos;
  }

  /* Laag 1 — fysische versnellingsclamp t.o.v. de vorige
     geaccepteerde sample. Omhoog max. 4 m/s², omlaag 10 m/s²
     (noodstops zijn echt). Clampen i.p.v. verwerpen: bij echte
     aanhoudende snelheid haalt de meter binnen 1–2 fixes in.
     De dt-schaling maakt lange fix-gaten vanzelf clamp-vrij. */
  if (m !== null && spdF.lastM != null){
    const dtRef = (ts - spdF.lastTs) / 1000;
    if (dtRef > 0){
      const up   = spdF.lastM + 4  * dtRef;
      const down = spdF.lastM - 10 * dtRef;
      if (m > up || m < down){
        const clamped = Math.max(0, Math.min(up, Math.max(down, m)));
        if (Date.now() - spdF.lastDiagAt >= 10000){
          spdF.lastDiagAt = Date.now();
          diagAdd("speed.clamped", {
            raw:+m.toFixed(2), clamped:+clamped.toFixed(2),
            dt:+dtRef.toFixed(2)
          });
        }
        m = clamped;
      }
    }
  }

  /* Laag 3 (voorbereiding) — bevestigde snelheid: het minimum van
     de twee laatste geaccepteerde samples. trip.max kan daardoor
     alleen stijgen als twee opeenvolgende fixes boven het oude
     maximum liggen; één spike-fix haalt het per constructie nooit. */
  let mConfirmed = null;
  if (m !== null){
    mConfirmed = spdF.lastM == null ? null : Math.min(spdF.lastM, m);
    spdF.lastM = m;
    spdF.lastTs = ts;
  }

   /* Stationary state wordt bepaald uit meerdere recente fixes.
     Dit beïnvloedt alleen de visuele stilstandsmodus en de weergegeven
     snelheid; ruwe GPS blijft elders beschikbaar voor logging/nav. */
  updateStationaryState(ts, m, acc);

  if (stationary.active){
    /* Terwijl de visuele positie vergrendeld is, laat de weergegeven
       snelheid snel maar niet abrupt naar nul zakken. */
    dispSpeed *= .22;

    if (dispSpeed < .35){
      dispSpeed = 0;
    }

    /* Patch 12: tijdens bevestigde stilstand een verse nul-
       referentie voor de versnellingsclamp, zodat wegrijden niet
       tegen een verouderde snelheid wordt geclampt. 4 m/s² vanaf 0
       geeft de eerstvolgende fix ruim voldoende snelheid (≈14 km/u
       bij 1 Hz) om ook de stationary-exit (1,65 m/s) te halen. */
    spdF.lastM = 0;
    spdF.lastTs = ts;
  } else if (m !== null){
     if (m < .6){
      m = 0;
    }

    dispSpeed += alphaFor(acc, m) * (m - dispSpeed);

    if (dispSpeed < .45 && m < .7){
      dispSpeed = 0;
    }
  }
  
  /* ── koersmeting ─────────────────────────────────────────
     Stationary lock blijft dominant. Tijdens beweging kiezen we
     een gemeten koers, maar geven die nog niet rechtstreeks aan
     marker of camera door. */
  if (!stationary.active && dispSpeed >= BEARING_MIN_SPEED_MS){
    let measuredBearing = null;

    /* Native heading is bij hogere snelheid doorgaans bruikbaar.
       Bij wandelen prefereren we bewust de langere ruimtelijke GPS-basis,
       omdat instant heading dan vaak nerveus is. */
    if (
      dispSpeed >= 3 &&
      c.heading != null &&
      !isNaN(c.heading)
    ){
      measuredBearing = normBearing(c.heading);
    }

    if (measuredBearing == null){
      measuredBearing = derivedBearingFromFixes(
        ts,
        c.latitude,
        c.longitude,
        acc,
        dispSpeed
      );
    }

    /* Als afgeleide koers nog geen voldoende lange basis heeft,
       mag native heading als fallback dienen. */
    if (
      measuredBearing == null &&
      c.heading != null &&
      !isNaN(c.heading) &&
      dispSpeed >= 1.3
    ){
      measuredBearing = normBearing(c.heading);
    }

    if (measuredBearing != null){
      bearingState.measured = measuredBearing;

      /* lastBearing blijft de app-brede, gefilterde koersbron.
         De daadwerkelijke marker- en camerafilters volgen hieronder
         in hun eigen renderpaden. */
      if (lastBearing == null){
        lastBearing = measuredBearing;
      } else {
        const d = Math.abs(
          shortestBearingDelta(lastBearing, measuredBearing)
        );

        const deadband = markerBearingDeadband(dispSpeed);

        if (d >= deadband){
          /* GPS-fixes komen niet exact periodiek. Gebruik daarom
             een bescheiden per-fix alpha, afhankelijk van snelheid. */
          const alpha =
            dispSpeed < 3 ? 0.22 :
            dispSpeed < 8 ? 0.36 :
                            0.52;

          lastBearing = bearingLerp(
            lastBearing,
            measuredBearing,
            alpha
          );
        }
      }
    }
  }

 /* tripafstand + routepunten (hoogte altijd NAP-gecorrigeerd geregistreerd) */
 if (trip.running && acc <= 35){
    trip.accSum += acc; trip.accN++;
    const here = { lat:c.latitude, lon:c.longitude };

    if (tripLoss.lastBadPos){
      /* Einde slechte-accuracy-episode: de koorde vanaf de bevroren
         lastPos wordt hieronder via het normale pad geteld. */
      diagAdd("trip.bridge", {
        bridgeM: lastPos ? +hv(lastPos, here).toFixed(0) : null,
        badPathM: +tripLoss.accDropM.toFixed(0),
        badFixN: tripLoss.accDropN
      });
      tripLoss.lastBadPos = null;
    }
    if (lastPos){
      const d  = hv(lastPos, here);
      const dt = (ts - lastPos.t) / 1000;
      if (d > Math.min(acc, 12) * .6 && (dt <= 0 || d/dt < 70)){
        trip.dist += d;
        /* Patch 12 (laag 3): trip.max alleen verhogen wanneer twee
           opeenvolgende geaccepteerde, gefilterde samples boven het
           oude maximum liggen (mConfirmed = min van beide). Bewust
           op basis van m i.p.v. dispSpeed: de EMA draagt een spike
           anders nog 2–3 fixes mee het maximum in. */
        if (mConfirmed != null && mConfirmed > trip.max) trip.max = mConfirmed;
        lastPos = { ...here, t:ts };
      } else if (d > 200){
        tripLoss.glitchDropM += d;
        tripLoss.glitchN++;
        lastPos = { ...here, t:ts };
      } else {
        tripLoss.gateSkipN++;
      }
    } else lastPos = { ...here, t:ts };

    /* Snelheidsadaptieve routesampling (Patch 7): boven ~54 km/u is
       3 s / 25 m onnodig dicht. 10 s / 100 m houdt een lange autorit
       compact zonder merkbaar geometrieverlies; fiets-, brom- en
       bootgedrag blijft exact ongewijzigd. */
    const sampleFast = dispSpeed >= 15;
    const sampleMs = sampleFast ? 10000 : 3000;
    const sampleM  = sampleFast ? 100 : 25;
    if (!lastSample || ts - lastSample.t >= sampleMs || hv(lastSample, here) >= sampleM){
      route.push({ t:ts, lat:+c.latitude.toFixed(6), lon:+c.longitude.toFixed(6),
                   v:+dispSpeed.toFixed(2),
                   alt: lastAltRaw == null ? null : +(lastAltRaw - altOffset).toFixed(1),
                   acc: Math.round(acc) });
      lastSample = { ...here, t:ts };
    }

    if (Date.now() - tripLoss.lastLogAt >= 60000){
      tripLoss.lastLogAt = Date.now();
      diagAdd("trip.loss", {
        phase:"interval",
        distM:+trip.dist.toFixed(0),
        accDropM:+tripLoss.accDropM.toFixed(0),
        accDropN:tripLoss.accDropN,
        gateSkipN:tripLoss.gateSkipN,
        glitchDropM:+tripLoss.glitchDropM.toFixed(0),
        glitchN:tripLoss.glitchN,
        acc:Math.round(acc)
      });
    }
 } else if (trip.running){
    /* Patch 6b: bij acc > 35 schuift lastPos NIET meer op.
       De werkelijk gereden afstand over dit segment wordt bij de
       eerstvolgende goede fix als koorde alsnog geteld, beveiligd
       door de bestaande d/dt < 70-poort. De tellers meten het
       segment alleen nog ter verificatie. */
    const hereBad = { lat:c.latitude, lon:c.longitude };
    const badRef = tripLoss.lastBadPos ||
      (lastPos ? { lat:lastPos.lat, lon:lastPos.lon } : null);
    if (badRef) tripLoss.accDropM += hv(badRef, hereBad);
    tripLoss.accDropN++;
    tripLoss.lastBadPos = hereBad;
  } else {
    lastPos = { lat:c.latitude, lon:c.longitude, t:ts };
  }

   /* Navigatieberekeningen blijven altijd op de ruwe GPS-fix draaien.
     Stationary lock mag dus geen aankomst-, off-route- of reroute-logica
     kunstmatig beïnvloeden. */
  const routeProj = navOnFix(c);

  if (stationary.active && stationary.lockPos){
    /* Alleen de visuele laag krijgt het vergrendelde clustercentrum.
       Geen route-snap tijdens stationary lock: een reeds stilstaande
       marker moet niet alsnog langs de routelijn gaan schuiven. */
    updateCamera(
      stationary.lockPos.lon,
      stationary.lockPos.lat,
      stationary.lockBearing,
      acc,
      null
    );
  } else {
    updateCamera(
      c.longitude,
      c.latitude,
      lastBearing,
      acc,
      routeProj
    );
  }

  render();
}
   
function onErr(e){
  diagAdd("gps.error", {
    code:e && Number.isFinite(e.code)
      ? e.code
      : null,
    message:e && e.message
      ? String(e.message)
      : null,
    visibility:document.visibilityState,
    lastFixAgeMs:lastFixTime
      ? Math.max(0, Date.now() - lastFixTime)
      : null
  });

  /* Patch 8c: een error is óók een levensteken van de watch. */
  gpsWd.lastCallback = Date.now();

  if (e && e.code === 1){
    /* Permissie geweigerd: automatische herstarts zijn zinloos en
       zouden alleen ruis geven. Handmatige retry (ntcBtn) reset dit. */
    gpsWd.denied = true;
    gpsWd.errStreak = 0;
    showNotice(t("ntc_deny"), t("ntc_deny_t"));
  } else {
    $("gpsTxt").textContent = t("nofix");
    /* POSITION_UNAVAILABLE/TIMEOUT: pas na een reeks errors op rij
       (zonder tussenliggende fix) gecontroleerd herstarten. Eén losse
       timeout in een tunnel is geen reden voor een restart. */
    gpsWd.errStreak++;
    if (trip.running &&
        document.visibilityState === "visible" &&
        gpsWd.errStreak >= GPS_WD_ERR_STREAK){
      if (gpsWatchRestart("error_streak")) gpsWd.errStreak = 0;
    }
  }
}

let lastTick = Date.now();
setInterval(() => {
  const now = Date.now();
  const delta = now - lastTick;
  lastTick = now;

  if (firstFix && now - lastFixTime > 4000){
    dispSpeed *= .5; if (dispSpeed < .4) dispSpeed = 0;
  }
  if (dispSpeed > 1.2) lastMotion = now;
  if (dispSpeed < .55){
    if (zeroSince === null) zeroSince = now;
    isPaused = autoPause && (now - zeroSince > 5000);
  } else { zeroSince = null; isPaused = false; }
  
  if (trip.running && !(autoPause && isPaused)){ trip.ms += delta; }

  gpsWatchdogTick(now);   /* Patch 8c: stale-detectie GPS-watch */

  if (trip.running || dispSpeed > 0) render();
}, 1000);

  try{ LS.setItem("rm_trip", JSON.stringify(trip)); } catch(e){}
  if (trip.running) persistRoute();

 } else {

      accDropN:tripLoss.accDropN,

/* ── hoogteprofiel (Canvas) ──────────────────────────────── */
function drawProfile(pts){
  const cv = $("profile"), note = $("profNote");
  const data = []; let cum = 0;
  for (let i = 0; i < pts.length; i++){
    if (i) cum += hv(pts[i-1], pts[i]);
    if (pts[i].alt != null) data.push({ x:cum, y:pts[i].alt });
  }
  if (data.length < 2){
    cv.style.display = "none"; note.style.display = "block"; note.textContent = t("no_alt"); return;
  }
  cv.style.display = "block"; note.style.display = "none";
  const dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth || 300, H = 140;
  cv.width = W * dpr; cv.height = H * dpr;
  const g = cv.getContext("2d"); g.scale(dpr, dpr);
  const padL = 34, padR = 8, padT = 10, padB = 20;
  const minY0 = Math.min(...data.map(p => p.y)), maxY0 = Math.max(...data.map(p => p.y));
  const span = Math.max(10, maxY0 - minY0);
  const minY = minY0 - (span - (maxY0 - minY0)) / 2;
  const maxX = data[data.length - 1].x || 1;
  const X = x => padL + (x / maxX) * (W - padL - padR);
  const Y = y => padT + (1 - (y - minY) / span) * (H - padT - padB);
  g.clearRect(0, 0, W, H);
  g.beginPath(); g.moveTo(X(data[0].x), Y(data[0].y));
  for (const p of data) g.lineTo(X(p.x), Y(p.y));
  g.lineTo(X(maxX), H - padB); g.lineTo(X(0), H - padB); g.closePath();
  g.fillStyle = "rgba(255,179,0,.12)"; g.fill();
  g.beginPath(); g.moveTo(X(data[0].x), Y(data[0].y));
  for (const p of data) g.lineTo(X(p.x), Y(p.y));
  g.strokeStyle = "#FFB300"; g.lineWidth = 2; g.lineJoin = "round"; g.stroke();
  g.fillStyle = "#7E8B98"; g.font = "10px system-ui";
  const aF = m => useMph ? Math.round(m * 3.28084) + " ft" : Math.round(m) + " m";
  g.fillText(aF(maxY0), 2, Y(maxY0) + 3);
  g.fillText(aF(minY0), 2, Y(minY0) + 3);
  g.fillText("0", padL, H - 6);
  const dTxt = fmtDist(maxX) + " " + (useMph ? "mi" : "km");
  g.fillText(dTxt, W - padR - g.measureText(dTxt).width, H - 6);
}

const gpxDoc = inner => `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="RitMeter" xmlns="http://www.topografix.com/GPX/1/1">
${inner}
</gpx>`;
function trkXML(r){
  const pts = (r.points || []).map(p =>
    `      <trkpt lat="${p.lat}" lon="${p.lon}">` +
    (p.alt != null ? `<ele>${p.alt}</ele>` : "") +
    `<time>${new Date(p.t).toISOString()}</time></trkpt>`).join("\n");
  return `  <trk>\n    <name>${r.name}</name>\n    <trkseg>\n${pts}\n    </trkseg>\n  </trk>`;
}
const toGPX = r => gpxDoc(trkXML(r));
async function shareOrDownload(file, title){
  if (navigator.canShare && navigator.canShare({ files:[file] })){
    try { await navigator.share({ files:[file], title }); return; } catch(e){}
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(file); a.download = file.name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
async function shareGPX(){
  const r = await idbGet(detId); if (!r) return;
  const fname = "ritmeter_" + new Date(r.start).toISOString().slice(0,16).replace(/[:T]/g,"-") + ".gpx";
  shareOrDownload(new File([toGPX(r)], fname, { type:"application/gpx+xml" }), r.name);
}
async function gpxAll(){
 const trips = (await idbAll().catch(() => []))
    .filter(r => r && typeof r.dist === "number")
    .sort((a,b) => a.id - b.id);
  if (!trips.length) return;
  shareOrDownload(new File([gpxDoc(trips.map(trkXML).join("\n"))],
    "ritmeter_alle_ritten.gpx", { type:"application/gpx+xml" }), "RitMeter");
}
async function backup(){
 const trips = (await idbAll().catch(() => []))
    .filter(r => r && typeof r.dist === "number");
  const data = JSON.stringify({ app:"ritmeter", v:1, exported:new Date().toISOString(), trips });
  const fname = "ritmeter_backup_" + new Date().toISOString().slice(0,10) + ".json";
  shareOrDownload(new File([data], fname, { type:"application/json" }), "RitMeter back-up");
}
async function restore(file){
  try{
    const data = JSON.parse(await file.text());
    if (!data || data.app !== "ritmeter" || !Array.isArray(data.trips)) throw new Error();
    let n = 0;
    for (const r of data.trips)
      if (r && r.id && typeof r.dist === "number"){ await idbPut(r); n++; }
    toast(n + " " + t("restored")); openHist();
  } catch(e){ toast(t("bad_file")); }
}

/* native Wake Lock API (Android/desktop) */
let wakeLock = null;
async function acquireWake(){
  if (!("wakeLock" in navigator) || document.visibilityState !== "visible") return;
  if (wakeLock && !wakeLock.released) return;
  try{
    wakeLock = await navigator.wakeLock.request("screen");
    wakeLock.addEventListener("release", () => { wakeLock = null; });
  } catch(e){ wakeLock = null; }
}
function releaseWake(){
  if (wakeLock){ try { wakeLock.release(); } catch(e){} wakeLock = null; }
}

/* moet het scherm nú wakker blijven? */
function shouldStayAwake(){
  if (trip.running || state.nav === "route") return true;
  return (Date.now() - lastMotion) < KEEP_GRACE;
}
function applyKeepAwake(){
  if (document.visibilityState !== "visible") return;
  const want = shouldStayAwake();
  if (want){
    acquireWake();
    if (IS_IOS){ const v = keepVideo(); if (v.paused) v.play().catch(()=>{}); }
  } else {
    releaseWake();
    if (IS_IOS && keepVid && !keepVid.paused) keepVid.pause();
  }
}

   daarna mogen we het programmatisch sturen. */

  if (IS_IOS){ const v = keepVideo(); v.play().then(() => { if (!shouldStayAwake()) v.pause(); }).catch(()=>{}); }
  applyKeepAwake();
}, { once:false });

/* ═══════════════════════════════════════════════════════════
   RitMeter — navigatiemodule
   - Photon geocoding + BRouter routing (GeoJSON)
   - geen turn-by-turn-afslaginstructies
   - resterende afstand + ETA via projectie op de routelijn
   - visuele route-snap met confidence-poort; ruwe GPS blijft meetbron
   - off-route-detectie + gedebounceerde auto-reroute
   - favorieten in localStorage (rm_fav_nav, max 5)
   - alle zichtbaarheid loopt via state.nav → render()
   ═══════════════════════════════════════════════════════════ */
const PHOTON  = "https://photon.komoot.io/api/";
const BROUTER = "https://brouter.de/brouter";

/* km/u: cap = realistische bovengrens, def = vaste schatting bij onbruikbare API-tijd */
const SPEED = { car:{cap:140,def:60}, bike:{cap:35,def:18},
                moped:{cap:50,def:40}, snor:{cap:30,def:25} };
function profileFor(mode){
  if (mode === "bike" || mode === "snor") return "trekking";
  return mode === "moped" ? "moped" : "car-fast";        // brom = moped, auto = car-fast
}

const nav = {
  profile: vehicle, dest: null,
  coords: [], cum: [], distM: 0, etaS: 0, vAvg: 8,
  remM: 0, remEtaS: 0,
  destMarker: null, lastNear: null,
  offSince: null, rerouting: false, lastReroute: 0,
  doneFrac: 0                    /* Patch 24: fractie van de route die al
                                    gereden is, 0..1 */
};
let navHere = null;                  // laatst bekende GPS-positie {lat,lon}
let geoTimer = null, geoSeq = 0;

/* ── geo-helpers ─────────────────────────────────────────── */
/* punt→lijnsegment-projectie (meters), lokaal vlak rond p */
function segProject(p, a, b){
  const latR = p.lat*Math.PI/180, mLat = 111320;
  const mLon = 111320*Math.max(1e-6, Math.abs(Math.cos(latR)));
  const ax=(a.lon-p.lon)*mLon, ay=(a.lat-p.lat)*mLat;
  const bx=(b.lon-p.lon)*mLon, by=(b.lat-p.lat)*mLat;
  const dx=bx-ax, dy=by-ay, L2=dx*dx+dy*dy;
  let tt = L2>0 ? -((ax*dx+ay*dy)/L2) : 0;
  tt = Math.max(0, Math.min(1, tt));
  const px=ax+tt*dx, py=ay+tt*dy;
  return {
    d:Math.hypot(px,py), t:tt,
    lat:p.lat + py/mLat,
    lon:p.lon + px/mLon,
    bearing:routeBearing(a,b)
  };
}
function segDist(p, a, b){
  const q = segProject(p,a,b);
  return { d:q.d, t:q.t };
}

/* dichtstbijzijnde routeprojectie, gevensterd rond de vorige match.
   Bij een grote afwijking volgt één volledige scan om weer te herstellen. */
function nearestRouteProjection(here){
  const n = nav.coords.length;
  if (n < 2) return null;

  function scan(lo, hi){
    let best = null;
    for (let i=lo; i<hi; i++){
      const q = segProject(here, nav.coords[i], nav.coords[i+1]);
      if (!best || q.d < best.d){
        const segLen = (nav.cum[i+1] || 0) - (nav.cum[i] || 0);
        best = { ...q, seg:i, along:(nav.cum[i] || 0) + q.t*segLen };
      }
    }
    return best;
  }

  let lo=0, hi=n-1;
  if (nav.lastNear != null){
    lo=Math.max(0, nav.lastNear-30);
    hi=Math.min(n-1, nav.lastNear+120);
  }
  let best = scan(lo,hi);
  if (nav.lastNear != null && best && best.d > 150) best = scan(0,n-1);
  if (best) nav.lastNear = best.seg;
  return best;
}

/* Confidence-poort voor visueel snappen. Bij slechte GPS groeit de tolerantie,
   maar nooit verder dan 35 m: water/vrij terrein blijft daardoor vrij. */
function routeSnapLimit(acc){
  const a = Number.isFinite(acc) ? acc : 25;
  return Math.min(35, Math.max(12, 1.5*a));
}

/* Punt + routebearing op een cumulatieve afstand vanaf het begin van de route. */
function pointAtRouteAlong(along){
  const n = nav.coords.length;
  if (n < 2 || nav.cum.length !== n) return null;
  const total = nav.cum[n-1] || 0;
  const s = Math.max(0, Math.min(total, along || 0));
  let lo=0, hi=n-1;
  while (lo+1<hi){
    const mid=(lo+hi)>>1;
    if ((nav.cum[mid] || 0) <= s) lo=mid; else hi=mid;
  }
  const a=nav.coords[lo], b=nav.coords[Math.min(lo+1,n-1)];
  const d0=nav.cum[lo] || 0, d1=nav.cum[Math.min(lo+1,n-1)] || d0;
  const tt=d1>d0 ? (s-d0)/(d1-d0) : 0;
  const dLon=((b.lon-a.lon+540)%360)-180;
  return {
    lat:a.lat + (b.lat-a.lat)*tt,
    lon:((a.lon + dLon*tt + 540)%360)-180,
    bearing:routeBearing(a,b), along:s, seg:lo
  };
}

function favGet(){ try { return JSON.parse(LS.getItem("rm_fav_nav") || "[]"); } catch { return []; } }
